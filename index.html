<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VibePod">
<meta name="description" content="VibePod — музыкальный плеер для публичных папок Яндекс Диска с избранным и сохранением треков для прослушивания без интернета">
<meta name="theme-color" content="#1b1e22">
<meta name="referrer" content="no-referrer">
<!-- ОСТАВЬ СВОЮ СТРОКУ <link rel="apple-touch-icon" href="data:image/png;base64,..."> БЕЗ ИЗМЕНЕНИЙ -->
<link rel="manifest" href="manifest.webmanifest">
<title>VibePod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jura:wght@500;600;700&family=Unbounded:wght@700;800&display=swap">
<style>
/* Layout: one hardware faceplate. Glowing VFD window on top, four transport keys, then a 24-detent selector knob. */
:root{
  --row:34px; --rowf:17px;   /* list row height and text size; larger on a computer screen */
  --dw:100vw; --dh:100vh;   /* the deck's own width/height; swapped by script when the phone is turned */
  --room:#0b0c0e;
  --plate:#1b1e22; --plate-hi:#262a30; --plate-lo:#131518;
  --silk:#dfe3e8; --silk-dim:#aab1ba; --engrave:#7d858f; --engrave-dim:#4b5159;
  --glass:#04100e;
  --glow:#74f2d9; --dim:rgba(116,242,217,.42); --ghost:rgba(116,242,217,.11);
  --halo:0 0 1px rgba(116,242,217,.9),0 0 9px rgba(116,242,217,.45);
  --f-brand:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-vfd:"Jura","Trebuchet MS",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* the canvas takes the plate's bottom colour, so no strip of another grey can show under the deck */
html{background:var(--plate-lo)}
body{
  background:transparent;color:var(--engrave);font-family:var(--f-mono);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
.deck{
  /* pinned to all four edges: in a home-screen app 100vh/100dvh can come up short by the status bar */
  position:fixed;inset:0;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--plate-hi),var(--plate) 45%,var(--plate-lo));
}
@media (min-width:560px) and (min-height:600px){
  body{background:var(--room);display:grid;place-items:center}
  .deck{position:relative;inset:auto;width:440px;height:min(920px,calc(100dvh - 48px));border-radius:30px;
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
}


/* VFD window */
.vfd{
  position:relative;flex:1 1 auto;min-height:170px;display:flex;flex-direction:column;gap:6px;
  padding:10px 12px 9px;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#0a1c19,var(--glass) 70%);
  box-shadow:inset 0 0 0 1px #000,inset 0 6px 18px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.07);
  color:var(--glow);font-family:var(--f-vfd);
}
.vfd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.6) .6px,transparent 1px);background-size:3px 3px;opacity:.35}
.vfd::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 32%)}
.vfd-title.can-back{cursor:pointer;color:var(--glow)}
.vfd-title.can-back:focus-visible{outline:1px solid var(--glow);outline-offset:2px;border-radius:3px}
.vfd-title .bk{font-size:15px;line-height:0;margin-right:2px}
.vfd{touch-action:none}
.vfd-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--ghost);padding-bottom:5px}
.vfd-title{flex:1 1 auto;min-width:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfd-brand{flex:0 0 auto;font-family:var(--f-brand);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim);user-select:none}
.vfd-body{position:relative;flex:1 1 auto;min-height:0}
.row{display:flex;align-items:center;gap:6px;height:var(--row);padding-right:12px;cursor:pointer;
  font-weight:600;font-size:var(--rowf);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.row.on{color:var(--glow);text-shadow:var(--halo)}
.car{flex:0 0 12px;width:12px}
.lbl{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}
.txt{display:inline-block;white-space:nowrap}
.txt.mq{animation:mq var(--dur,6s) linear .8s infinite alternate}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--shift,0))}}
.hint{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em}
.sb{position:absolute;right:0;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--ghost)}
.sb i{position:absolute;left:0;right:0;border-radius:2px;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.msg{display:flex;flex-direction:column;gap:6px;padding:12px 0 10px;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:var(--halo)}
.msg small{font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--dim);text-shadow:none}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

/* now playing */
.np{display:flex;flex-direction:column;height:100%;gap:8px;padding-top:2px}
.np-meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--dim)}
.np-meta span:first-child{flex:0 0 auto;white-space:nowrap}
.np-meta span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.np-mid{margin-block:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.np-artist{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-title{font-size:clamp(21px,calc(var(--dw) * .066),29px);font-weight:700;line-height:1.08;letter-spacing:.02em;text-transform:uppercase;text-shadow:var(--halo);
  text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.np-err{font-family:var(--f-mono);font-size:10.5px;line-height:1.45;letter-spacing:.02em;color:var(--glow);overflow-wrap:anywhere;text-transform:none}
.np-actions{display:flex;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.np-actions .vbtn{min-width:15.5em;justify-content:center;display:inline-flex;align-items:center;gap:6px;text-decoration:none;touch-action:manipulation;padding:8px 11px}
.np-note{font-family:var(--f-mono);font-size:10px;line-height:1.35;letter-spacing:.02em;color:var(--dim)}
.vbtn.on{background:rgba(116,242,217,.16);border-color:var(--glow);text-shadow:var(--halo)}
.vbtn.off{opacity:.45;pointer-events:none}
.np-bar{display:grid;grid-template-columns:repeat(32,1fr);gap:2px;height:10px;flex:0 0 auto}
.np-bar i{background:var(--ghost)}
.np-bar i.on{background:var(--glow);box-shadow:0 0 6px rgba(116,242,217,.6)}
.np-time{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;text-shadow:var(--halo)}
.np-time .scrub{animation:blink .7s steps(2) infinite}

/* folder link editor */
.edit{display:flex;flex-direction:column;gap:10px;padding-top:8px;font-family:var(--f-mono)}
.edit label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.edit input{width:100%;min-width:0;font:500 15px/1.3 var(--f-mono);color:var(--glow);background:rgba(116,242,217,.05);
  border:1px solid var(--dim);border-radius:6px;padding:10px;-webkit-user-select:text;user-select:text;outline:none}
.edit input.bad{border-color:#ff8a7a;box-shadow:0 0 0 3px rgba(255,138,122,.18)}
.edit input:focus{border-color:var(--glow);box-shadow:0 0 0 3px rgba(116,242,217,.15)}
.edit-err{font-size:11px;line-height:1.4;color:#ff8a7a}
.edit-err[hidden]{display:none}
.edit-row{display:flex;gap:8px;flex-wrap:wrap}
.vbtn{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--glow);background:transparent;
  border:1px solid var(--dim);border-radius:5px;padding:9px 12px;cursor:pointer}
.vbtn.primary{background:rgba(116,242,217,.14);text-shadow:var(--halo)}
.vbtn:focus-visible{outline:2px solid var(--glow);outline-offset:2px;box-shadow:0 0 0 3px rgba(116,242,217,.2)}
.edit small{font-size:11px;line-height:1.45;color:var(--dim)}



/* selector knob */
.dial-zone{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dial-hint{margin:0;font-family:var(--f-mono);font-size:10px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--engrave);text-align:center}
.dial{position:relative;width:min(calc(var(--dw) * .78),calc(var(--dh) * .4),340px);max-width:100%;aspect-ratio:1}
.knob{position:absolute;inset:4%;border-radius:50%;touch-action:none;cursor:grab;filter:drop-shadow(0 12px 16px rgba(0,0,0,.55));transition:transform .12s ease-out}
.knob:focus-visible{outline:2px solid var(--glow);outline-offset:4px}
/* pressing an edge tips the knob toward it, like a car-console controller */
.knob.t-up{transform:perspective(700px) rotateX(9deg)}
.knob.t-down{transform:perspective(700px) rotateX(-9deg)}
.knob.t-left{transform:perspective(700px) rotateY(-9deg)}
.knob.t-right{transform:perspective(700px) rotateY(9deg)}
.knob:active{cursor:grabbing}
.knob-face{position:absolute;inset:0;border-radius:50%;will-change:transform;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.05) 1px 2px),radial-gradient(circle,#c3c8cd,#a2a8ae 75%,#90969d);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.25)}
/* uneven spun-metal grain: turns with the knob, so rotation stays visible without any marks */
.knob-face::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,255,255,.12),rgba(0,0,0,.07) 26deg,rgba(255,255,255,.05) 63deg,rgba(0,0,0,.09) 101deg,rgba(255,255,255,.11) 143deg,rgba(0,0,0,.05) 190deg,rgba(255,255,255,.08) 232deg,rgba(0,0,0,.08) 281deg,rgba(0,0,0,.05) 324deg,rgba(255,255,255,.12))}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:overlay;
  background:conic-gradient(from 200deg,transparent,rgba(255,255,255,.6) 40deg,transparent 95deg,rgba(0,0,0,.3) 180deg,transparent 250deg,rgba(255,255,255,.4) 300deg,transparent 345deg)}
.cap{position:absolute;inset:31%;border-radius:50%;border:0;cursor:pointer;touch-action:manipulation;
  color:var(--silk-dim);font:500 11px/1 var(--f-mono);letter-spacing:.2em;padding:0 0 0 .2em;
  background:radial-gradient(circle at 50% 35%,#3c4148,#1c1f23 70%);
  box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 0 4px rgba(255,255,255,.14),inset 0 2px 3px rgba(255,255,255,.08),inset 0 -3px 6px rgba(0,0,0,.6)}
.cap.armed{box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 0 4px var(--glow),0 0 22px rgba(116,242,217,.6),inset 0 4px 9px rgba(0,0,0,.75)}
.cap:active{transform:scale(.985);box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 0 4px rgba(255,255,255,.1),inset 0 4px 9px rgba(0,0,0,.75)}
.cap:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
@media (max-height:580px) and (orientation:portrait){.dial{width:min(calc(var(--dw) * .72),calc(var(--dh) * .35),290px)}.dial-hint{font-size:9px}}

/* Landscape: the deck lies on its side - display fills the left, the wheel sits on the right */
@media (orientation:landscape){
  .deck{flex-direction:row;align-items:stretch;gap:clamp(14px,3vw,40px);max-width:none;
    padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 16px)}
  .vfd{flex:1 1 auto;min-width:0;min-height:0}
  .dial-zone{padding-inline:clamp(0px,1vw,16px)}
  .dial{width:min(calc(var(--dh) * .68),calc(var(--dw) * .38),420px)}
  .dial-hint{max-width:260px}
  .np-artist{font-size:clamp(15px,calc(var(--dh) * .026),22px)}
  .np-title{font-size:clamp(21px,calc(var(--dh) * .056),46px)}
  .np-time{font-size:clamp(22px,calc(var(--dh) * .038),34px)}
}
/* computer or tablet: a framed device that uses most of the window */
@media (orientation:landscape) and (min-width:900px) and (min-height:500px){
  .deck{position:relative;inset:auto;width:calc(100vw - 48px);max-width:1500px;height:calc(100dvh - 48px);max-height:940px;
    border-radius:30px;padding:24px 36px 24px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
  :root{--row:48px;--rowf:23px}
  .vfd{padding:16px 22px 14px;gap:10px}
  .vfd-title,.np-meta{font-size:13px}
  .vfd-brand{font-size:11px}
  .vfd-title .bk{font-size:18px}
  .np-actions .vbtn{font-size:13px;padding:10px 14px}
  .np-bar{height:14px}
}
@media (prefers-reduced-motion:reduce){.txt.mq,.blink,.np-time .scrub{animation:none}}
</style>
</head>
<body>
<main class="deck">
  <section class="vfd" aria-live="polite">
    <div class="vfd-head">
      <div class="vfd-title" id="vtitle">ГЛАВНОЕ</div>
      <div class="vfd-brand" aria-label="VibePod">VIBEPOD</div>
    </div>
    <div class="vfd-body" id="vbody"></div>
  </section>

  <div class="dial-zone">
    <div class="dial">
      <div class="knob" id="knob" role="slider" aria-label="Колесо управления: вращение — выбор, края: сверху — назад, снизу — пуск и пауза, слева и справа — переключение треков" aria-describedby="dialHint" tabindex="0">
        <div class="knob-face" id="knobFace"></div>
        <div class="sheen"></div>
        <button class="cap" id="cap" type="button" aria-label="Центр: открыть или пауза; удержание — в избранное" aria-describedby="dialHint"></button>
      </div>
    </div>
    <p class="dial-hint" id="dialHint">Вращение — выбор · Центр — открыть · Удержание — избранное</p>
  </div>
</main>
<audio id="audio" preload="auto" playsinline></audio>

<script>
(() => {
'use strict';

const DEFAULT_KEY = 'https://disk.yandex.ru/d/boUVJ0ImtvHbKg';
const API = 'https://cloud-api.yandex.net/v1/disk/public/resources';
const STEP = 15;          // degrees per detent, 24 detents per turn
const rowH = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row')) || 34;           // list row height in px
const SEGS = 32;          // progress segments
const LINK_TTL = 25 * 60e3;
// ОСТАВЬ СВОЮ СТРОКУ const SILENT = 'data:audio/wav;base64,...'; БЕЗ ИЗМЕНЕНИЙ
const ART = (document.querySelector('link[rel="apple-touch-icon"]') || {}).href || '';

/* ---------- storage ---------- */
// Internal storage prefix 'deka.', IndexedDB database 'deka' (v1), and window.__deka are intentionally preserved after rebranding to VibePod so existing user settings, favourites, and offline tracks remain intact without migration.
const store = {
  get(k, d) { try { const v = localStorage.getItem('deka.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('deka.' + k, JSON.stringify(v)); } catch (e) {} }
};
const settings = {
  clicks: store.get('clicks2', false),   // off by default: a page cannot tell when the phone is on silent
  repeat: store.get('repeat', 'all'),
  key: store.get('key', DEFAULT_KEY)
};

/* ---------- favourites: kept in this browser only, so every listener has their own ---------- */
const HEART = '♥︎';
let favAll = store.get('favs', {}), favVer = 0;
const favList = () => (favAll && favAll[settings.key]) || [];
const isFav = t => !!t && favList().some(f => f.p === t.path);
function toggleFav(t) {
  const list = favList().slice();
  const i = list.findIndex(f => f.p === t.path);
  if (i >= 0) list.splice(i, 1);
  else list.unshift({ p: t.path, n: t.name, f: t.folder || '', m: t.mime || '', s: t.size || 0 });
  favAll = Object.assign({}, favAll, { [settings.key]: list });
  store.set('favs', favAll); favVer++;
  return i < 0;
}
const favTracks = () => favList().map(f => ({ name: f.n, path: f.p, dir: false, audio: true, file: null, fileAt: 0, folder: f.f, mime: f.m, size: f.s }));

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const audio = $('audio'), vtitle = $('vtitle'), vbody = $('vbody'),
      knob = $('knob'), face = $('knobFace'), cap = $('cap');
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => {
  if (!isFinite(s) || s < 0) return '--:--';
  s = Math.floor(s);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};
function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const artistOf = t => { const seg = String((t && t.path) || '').split('/').filter(Boolean); return seg.length > 1 ? seg[0] : ((t && t.folder) || ''); };
function parentName(path) { const p = String(path || '').split('/').filter(Boolean); return p.length > 1 ? p[p.length - 2] : ''; }

/* "104_SALUKI_-_DISKO_BOL_72932686.mp3" -> {artist:"SALUKI", title:"DISKO BOL"} */
function parseName(fname, folder) {
  let s = String(fname).replace(/\.[a-z0-9]{2,5}$/i, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\s\d{6,}$/, '');
  s = s.replace(/^\d{1,3}[.)]\s*/, '');
  const m = s.match(/^(?:\d{1,4}\s+)?(.+?)\s[-–—]\s(.+)$/);
  if (m) return { artist: m[1].trim(), title: m[2].trim() };
  return { artist: folder || '', title: s };
}

/* ---------- click + haptic feedback ---------- */
let actx = null, clickBuf = null;
function ensureAudioCtx() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    actx = new AC();
    const len = Math.floor(actx.sampleRate * 0.012);
    clickBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = clickBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
  } catch (e) { actx = null; }
}
function tick(strong) {
  if (settings.clicks && actx && clickBuf) {
    try {
      const s = actx.createBufferSource(); s.buffer = clickBuf;
      const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = strong ? 1700 : 3300; f.Q.value = 1.3;
      const g = actx.createGain(); g.gain.value = strong ? 0.9 : 0.55;
      s.connect(f); f.connect(g); g.connect(actx.destination); s.start();
    } catch (e) {}
  }
}

/* ---------- Yandex Disk ---------- */
const cache = new Map();
async function apiJSON(url) {
  const r = await fetch(url);
  if (!r.ok) {
    let msg = '';
    try { const j = await r.json(); msg = j.description || j.message || ''; } catch (e) {}
    const err = new Error(msg || ('HTTP ' + r.status)); err.status = r.status; throw err;
  }
  return r.json();
}
async function listFolder(path) {

document.addEventListener('pointerdown', unlock, { capture: true, passive: true });
vtitle.addEventListener('click', () => { if (stack.length > 1) { unlock(); tick(true); back(); } });
vtitle.addEventListener('keydown', e => {
  if (stack.length > 1 && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); unlock(); tick(true); back();
  }
});
// swipe right across the display = back
let swX = null, swY = 0;
const vfdEl = document.querySelector('.vfd');
vfdEl.addEventListener('pointerdown', e => { swX = e.clientX; swY = e.clientY; });
vfdEl.addEventListener('pointerup', e => {
  if (swX == null) return;
  let dx = e.clientX - swX, dy = e.clientY - swY;
  if (screenRot) { const r = -screenRot * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r); [dx, dy] = [dx * c - dy * sn, dx * sn + dy * c]; }
  swX = null;
  if (dx > 60 && Math.abs(dy) < 50 && stack.length > 1) { tick(true); back(); }
});
document.addEventListener('touchstart', () => {}, { passive: true });   // enables :active on iOS
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT') return;
  const k = e.key;
  if (k === 'ArrowDown') { turn(STEP); e.preventDefault(); }
  else if (k === 'ArrowUp') { turn(-STEP); e.preventDefault(); }
  else if (k === 'Enter' && tag !== 'BUTTON') { tick(true); select(); e.preventDefault(); }
  else if (k === 'Escape' || k === 'Backspace') { tick(true); back(); e.preventDefault(); }
  else if (k === ' ' && tag !== 'BUTTON') { togglePlay(); e.preventDefault(); }
  else if (k === 'ArrowRight') next();
  else if (k === 'ArrowLeft') prev();
});
window.addEventListener('resize', () => { fitOrientation(); render(); });

function fitOrientation() {   // the deck follows the screen; --dw/--dh hold the real window size (iOS home-screen apps misreport 100vh)
  const root = document.documentElement;
  root.style.setProperty('--dw', window.innerWidth + 'px');
  root.style.setProperty('--dh', window.innerHeight + 'px');
}
fitOrientation();
window.addEventListener('orientationchange', () => setTimeout(() => { fitOrientation(); render(); }, 150));
