<title>Дека ДК-31</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jura:wght@500;600;700&family=Unbounded:wght@700;800&display=swap">
<style>
/* Layout: one hardware faceplate. Glowing VFD window on top, four transport keys, then a 24-detent selector knob. */
:root{
  --room:#0b0c0e;
  --plate:#1b1e22; --plate-hi:#262a30; --plate-lo:#131518;
  --silk:#dfe3e8; --silk-dim:#aab1ba; --engrave:#7d858f; --engrave-dim:#4b5159;
  --glass:#04100e;
  --glow:#74f2d9; --dim:rgba(116,242,217,.42); --ghost:rgba(116,242,217,.11);
  --halo:0 0 1px rgba(116,242,217,.9),0 0 9px rgba(116,242,217,.45);
  --f-brand:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-vfd:"Jura","Trebuchet MS",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--plate);color:var(--engrave);font-family:var(--f-mono);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
.deck{
  position:relative;height:100%;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--plate-hi),var(--plate) 45%,var(--plate-lo));
}
@media (min-width:560px){
  body{background:var(--room);display:grid;place-items:center}
  .deck{width:440px;height:min(920px,calc(100dvh - 48px));border-radius:30px;
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
}

/* faceplate header */
.plate-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--f-brand);font-weight:800;font-size:22px;letter-spacing:.14em;color:var(--silk);line-height:1}
.model{font-size:10px;letter-spacing:.14em;color:var(--silk-dim);border:1px solid var(--engrave-dim);padding:3px 6px;border-radius:3px;line-height:1}
.led{width:7px;height:7px;border-radius:50%;background:#16302b;box-shadow:inset 0 1px 1px rgba(0,0,0,.7)}
.led.on{background:var(--glow);box-shadow:0 0 8px var(--glow)}
.plate-note{font-size:9px;line-height:1.4;letter-spacing:.14em;text-transform:uppercase;text-align:right;text-shadow:0 1px 0 rgba(0,0,0,.6)}

/* VFD window */
.vfd{
  position:relative;flex:1 1 auto;min-height:170px;display:flex;flex-direction:column;gap:6px;
  padding:10px 12px 9px;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#0a1c19,var(--glass) 70%);
  box-shadow:inset 0 0 0 1px #000,inset 0 6px 18px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.07);
  color:var(--glow);font-family:var(--f-vfd);
}
.vfd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.6) .6px,transparent 1px);background-size:3px 3px;opacity:.35}
.vfd::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 32%)}
.ann{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--ghost)}
.ann span.on{color:var(--glow);text-shadow:var(--halo)}
.vfd-title{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--dim);
  border-bottom:1px solid var(--ghost);padding-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfd-body{position:relative;flex:1 1 auto;min-height:0}
.row{display:flex;align-items:center;gap:6px;height:34px;padding-right:12px;cursor:pointer;
  font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.row.on{color:var(--glow);text-shadow:var(--halo)}
.car{flex:0 0 12px;width:12px}
.lbl{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}
.txt{display:inline-block;white-space:nowrap}
.txt.mq{animation:mq var(--dur,6s) linear .8s infinite alternate}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--shift,0))}}
.hint{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em}
.sb{position:absolute;right:0;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--ghost)}
.sb i{position:absolute;left:0;right:0;border-radius:2px;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.msg{display:flex;flex-direction:column;gap:6px;padding:12px 0 10px;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:var(--halo)}
.msg small{font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--dim);text-shadow:none}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

/* now playing */
.np{display:flex;flex-direction:column;height:100%;gap:8px;padding-top:2px}
.np-meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--dim)}
.np-meta span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.np-mid{margin-block:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.np-artist{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-title{font-size:clamp(21px,6.6vw,29px);font-weight:700;line-height:1.08;letter-spacing:.02em;text-transform:uppercase;text-shadow:var(--halo);
  text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.np-bar{display:grid;grid-template-columns:repeat(32,1fr);gap:2px;height:10px;flex:0 0 auto}
.np-bar i{background:var(--ghost)}
.np-bar i.on{background:var(--glow);box-shadow:0 0 6px rgba(116,242,217,.6)}
.np-time{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;text-shadow:var(--halo)}
.np-time .scrub{animation:blink .7s steps(2) infinite}

/* folder link editor */
.edit{display:flex;flex-direction:column;gap:10px;padding-top:8px;font-family:var(--f-mono)}
.edit label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.edit input{width:100%;min-width:0;font:500 15px/1.3 var(--f-mono);color:var(--glow);background:rgba(116,242,217,.05);
  border:1px solid var(--dim);border-radius:6px;padding:10px;-webkit-user-select:text;user-select:text;outline:none}
.edit input:focus{border-color:var(--glow);box-shadow:0 0 0 3px rgba(116,242,217,.15)}
.edit-row{display:flex;gap:8px;flex-wrap:wrap}
.vbtn{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--glow);background:transparent;
  border:1px solid var(--dim);border-radius:5px;padding:9px 12px;cursor:pointer}
.vbtn.primary{background:rgba(116,242,217,.14);text-shadow:var(--halo)}
.edit small{font-size:11px;line-height:1.45;color:var(--dim)}

.vfd-foot{display:flex;align-items:center;gap:8px;min-height:17px;padding-top:6px;border-top:1px solid var(--ghost);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--dim)}
.vfd-foot.flash{color:var(--glow);text-shadow:var(--halo)}
.ft-txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.ft-time{font-variant-numeric:tabular-nums}

/* transport keys */
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:0 0 auto}
.key{height:50px;border:0;border-radius:7px;cursor:pointer;touch-action:manipulation;
  display:grid;place-items:center;color:var(--silk-dim);font:500 11px/1 var(--f-mono);letter-spacing:.16em;padding-left:.16em;
  background:linear-gradient(180deg,#31363c,#212429);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 0 #0a0b0d,0 5px 10px rgba(0,0,0,.4)}
.key svg{width:24px;height:14px;fill:currentColor}
.key:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.35),0 1px 0 #0a0b0d}
.key:focus-visible,.cap:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

/* selector knob */
.dial-zone{flex:0 0 auto;display:grid;place-items:center}
.dial{position:relative;width:min(74vw,36vh,330px);max-width:100%;aspect-ratio:1}
.scale{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scale line{stroke:var(--engrave-dim);stroke-width:1.4;stroke-linecap:round}
.scale line.maj{stroke:var(--engrave);stroke-width:2.2}
.knob{position:absolute;inset:11%;border-radius:50%;touch-action:none;cursor:grab;filter:drop-shadow(0 12px 16px rgba(0,0,0,.55))}
.knob:active{cursor:grabbing}
.knob-face{position:absolute;inset:0;border-radius:50%;will-change:transform;
  background:repeating-conic-gradient(from 0deg,#80878e 0deg 1.5deg,#d3d8dc 1.5deg 3deg)}
.knob-face::before{content:"";position:absolute;inset:6%;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.05) 1px 2px),radial-gradient(circle,#bcc1c6,#9aa0a6);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.notch{position:absolute;left:50%;top:10%;width:10px;height:10px;margin-left:-5px;border-radius:50%;
  background:var(--glow);box-shadow:0 0 9px var(--glow),inset 0 1px 1px rgba(0,0,0,.35)}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:overlay;
  background:conic-gradient(from 200deg,transparent,rgba(255,255,255,.6) 40deg,transparent 95deg,rgba(0,0,0,.3) 180deg,transparent 250deg,rgba(255,255,255,.4) 300deg,transparent 345deg)}
.cap{position:absolute;inset:31%;border-radius:50%;border:0;cursor:pointer;touch-action:manipulation;
  color:var(--silk-dim);font:500 11px/1 var(--f-mono);letter-spacing:.2em;padding:0 0 0 .2em;
  background:radial-gradient(circle at 50% 35%,#3c4148,#1c1f23 70%);
  box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 0 4px rgba(255,255,255,.14),inset 0 2px 3px rgba(255,255,255,.08),inset 0 -3px 6px rgba(0,0,0,.6)}
.cap:active{transform:scale(.985);box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 0 4px rgba(255,255,255,.1),inset 0 4px 9px rgba(0,0,0,.75)}

@media (prefers-reduced-motion:reduce){.txt.mq,.blink,.np-time .scrub{animation:none}}
</style>
</head>
<body>
<main class="deck">
  <header class="plate-top">
    <div class="brand">
      <span class="logo">ДЕКА</span>
      <span class="model">ДК-31</span>
      <span class="led" id="led" aria-hidden="true"></span>

  <div class="keys">

    <button class="key" id="kPrev" type="button" aria-label="Предыдущий трек"><svg viewBox="0 0 24 14"><path d="M2 1h2v12H2zM13 1v12L5 7zM22 1v12l-8-6z"/></svg></button>
    <button class="key" id="kPlay" type="button" aria-label="Пуск или пауза"><svg viewBox="0 0 24 14"><path d="M2 1l9 6-9 6zM15 1h2.5v12H15zM19.5 1H22v12h-2.5z"/></svg></button>
    <button class="key" id="kNext" type="button" aria-label="Следующий трек"><svg viewBox="0 0 24 14"><path d="M2 1l8 6-8 6zM11 1l8 6-8 6zM20 1h2v12h-2z"/></svg></button>
  </div>

  <div class="dial-zone">
    <div class="dial">
      <svg class="scale" id="scale" viewBox="0 0 200 200" aria-hidden="true"></svg>

        <div class="sheen"></div>
        <button class="cap" id="cap" type="button" aria-label="Выбор"></button>
      </div>
    </div>
  </div>
</main>
<audio id="audio" preload="auto" playsinline></audio>

<script>
(() => {
'use strict';

const DEFAULT_KEY = 'https://disk.yandex.ru/d/boUVJ0ImtvHbKg';
const API = 'https://cloud-api.yandex.net/v1/disk/public/resources';
const STEP = 15;          // degrees per detent, 24 detents per turn
const ROW = 34;           // list row height in px
const SEGS = 32;          // progress segments
const LINK_TTL = 25 * 60e3;
const SILENT = 'data:audio/wav;base64,UklGRvQHAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YdAHAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
const ART = (document.querySelector('link[rel="apple-touch-icon"]') || {}).href || '';

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('deka.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('deka.' + k, JSON.stringify(v)); } catch (e) {} }
};
const settings = {
  clicks: store.get('clicks', true),
  haptics: store.get('haptics', true),
  repeat: store.get('repeat', 'all'),
  key: store.get('key', DEFAULT_KEY)
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const audio = $('audio'), vtitle = $('vtitle'), vbody = $('vbody'), vfoot = $('vfoot'),
      ann = $('ann'), led = $('led'), knob = $('knob'), face = $('knobFace'), cap = $('cap');
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => {
  if (!isFinite(s) || s < 0) return '--:--';
  s = Math.floor(s);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};
function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function parentName(path) { const p = String(path || '').split('/').filter(Boolean); return p.length > 1 ? p[p.length - 2] : ''; }

/* "104_SALUKI_-_DISKO_BOL_72932686.mp3" -> {artist:"SALUKI", title:"DISKO BOL"} */
function parseName(fname, folder) {
  let s = String(fname).replace(/\.[a-z0-9]{2,5}$/i, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\s\d{6,}$/, '');
  s = s.replace(/^\d{1,3}[.)]\s*/, '');
  const m = s.match(/^(?:\d{1,4}\s+)?(.+?)\s[-–—]\s(.+)$/);
  if (m) return { artist: m[1].trim(), title: m[2].trim() };
  return { artist: folder || '', title: s };
}

/* ---------- click + haptic feedback ---------- */
let actx = null, clickBuf = null;
function ensureAudioCtx() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    actx = new AC();
    const len = Math.floor(actx.sampleRate * 0.012);
    clickBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = clickBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
  } catch (e) { actx = null; }
}
// iOS Safari has no navigator.vibrate; toggling a native switch gives a system haptic tick (iOS 18+).
const hapLabel = (() => {
  const l = document.createElement('label');
  l.setAttribute('aria-hidden', 'true');
  l.style.display = 'none';
  const i = document.createElement('input');
  i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1;
  l.appendChild(i); document.body.appendChild(l);
  return l;
})();
function buzz() {
  try {
    if (typeof navigator.vibrate === 'function') navigator.vibrate(7);
    else hapLabel.click();
  } catch (e) {}
}
function tick(strong) {
  if (settings.clicks && actx && clickBuf) {
    try {
      const s = actx.createBufferSource(); s.buffer = clickBuf;
      const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = strong ? 1700 : 3300; f.Q.value = 1.3;
      const g = actx.createGain(); g.gain.value = strong ? 0.9 : 0.55;
      s.connect(f); f.connect(g); g.connect(actx.destination); s.start();
    } catch (e) {}
  }
  if (settings.haptics) buzz();
}

/* ---------- Yandex Disk ---------- */
const cache = new Map();
async function apiJSON(url) {
  const r = await fetch(url);
  if (!r.ok) {
    let msg = '';
    try { const j = await r.json(); msg = j.description || j.message || ''; } catch (e) {}
    const err = new Error(msg || ('HTTP ' + r.status)); err.status = r.status; throw err;
  }
  return r.json();
}
async function listFolder(path) {
  const ck = settings.key + '|' + path;
  const hit = cache.get(ck);
  if (hit && Date.now() - hit.t < LINK_TTL) return hit.items;
  let raw = [], offset = 0, total = 1;
  while (offset < total) {
    const u = API + '?public_key=' + encodeURIComponent(settings.key) +
      (path && path !== '/' ? '&path=' + encodeURIComponent(path) : '') +
      '&limit=200&offset=' + offset + '&sort=name';
    const j = await apiJSON(u);
    const e = j._embedded || { items: [], total: 0 };
    const items = e.items || [];
    raw = raw.concat(items); total = e.total || 0; offset += items.length;
    if (!items.length) break;
  }
  const now = Date.now();
  const out = raw.map(it => ({
    name: it.name, path: it.path, dir: it.type === 'dir',
    audio: it.media_type === 'audio' || /\.(mp3|m4a|aac|wav|flac|alac|ogg|opus)$/i.test(it.name || ''),
    file: it.file || null, fileAt: now, folder: parentName(it.path)
  })).filter(x => x.dir || x.audio);
  cache.set(ck, { t: now, items: out });
  return out;
}
async function freshLink(t) {
  const j = await apiJSON(API + '/download?public_key=' + encodeURIComponent(settings.key) + '&path=' + encodeURIComponent(t.path));
  t.file = j.href; t.fileAt = Date.now();
  return j.href;
}
async function collectAll(onProgress) {
  const root = await listFolder('/');
  let files = root.filter(x => !x.dir);
  const todo = root.filter(x => x.dir);
  let done = 0, total = todo.length;
  onProgress(done, total);
  async function worker() {
    while (todo.length) {
      const d = todo.shift();
      try {
        const items = await listFolder(d.path);
        files = files.concat(items.filter(x => !x.dir));
        items.filter(x => x.dir).forEach(sd => { todo.push(sd); total++; });
      } catch (e) {}
      done++; onProgress(done, total);
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  return files;
}
function errText(e) {
  if (!e) return ['ОШИБКА', ''];
  if (e.status === 404) return ['ПАПКА НЕ НАЙДЕНА', 'Проверь ссылку в настройках'];
  if (e.status === 429) return ['ДИСК ПРОСИТ ПОДОЖДАТЬ', 'Попробуй через минуту'];
  if (e.status === 403) return ['ДОСТУП ЗАКРЫТ', e.message || 'Лимит скачиваний или закрытая папка'];
  if (e.status) return ['ОШИБКА ДИСКА ' + e.status, e.message || ''];
  if (e.custom) return [e.message, ''];
  return ['НЕТ СВЯЗИ С ДИСКОМ', 'Проверь интернет. Если ошибка не уходит, напиши Claude: «' + (e.message || 'fetch error') + '»'];
}

/* ---------- player ---------- */
let queue = [], qi = -1, current = null, shuffled = false, queueName = '';
let unlocked = false, buffering = false, loadCount = 0, flashMsg = '', flashTimer = 0;

function unlock() {
  ensureAudioCtx();
  if (unlocked) return;
  unlocked = true;
  if (!current) {
    audio.src = SILENT;
    const p = audio.play();
    if (p) p.then(() => { if (audio.src === SILENT) audio.pause(); }).catch(() => {});
  }
}
function setSrc(url) {
  audio.src = url;
  const p = audio.play();
  if (p) p.catch(err => { if (err && err.name === 'NotAllowedError') flash('НАЖМИ ▸ ЧТОБЫ ИГРАТЬ'); });
  prefetchNext();
}
function playAt(i) {
  if (!queue.length) return;
  qi = ((i % queue.length) + queue.length) % queue.length;
  const t = current = queue[qi];
  t.retry = 0;
  if (t.file && Date.now() - t.fileAt < LINK_TTL) setSrc(t.file);
  else {
    setLoad(true);
    freshLink(t).then(h => { setLoad(false); if (current === t) setSrc(h); })
      .catch(e => { setLoad(false); trackFailed(t, e); });
  }
  updateMeta(); setAnn(); render();
}
function prefetchNext() {
  const n = queue[qi + 1] || (settings.repeat === 'all' ? queue[0] : null);
  if (n && n !== current && !(n.file && Date.now() - n.fileAt < LINK_TTL / 2)) freshLink(n).catch(() => {});
}
function trackFailed(t, e) {
  if (current !== t) return;
  flash(e && e.status === 403 ? 'ЛИМИТ СКАЧИВАНИЙ НА ДИСКЕ' : 'ТРЕК НЕ ИГРАЕТ, ДАЛЬШЕ');
  if (qi < queue.length - 1) setTimeout(() => { if (current === t) playAt(qi + 1); }, 1400);
}
function next() { if (queue.length) playAt(qi + 1); }
function prev() {
  if (!queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  playAt(qi - 1);
}
function togglePlay() {
  if (!current) { flash('ВЫБЕРИ ТРЕК В МЕНЮ'); return; }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
}
function startQueue(files, idx, shuffle, name) {
  let list = files.slice();
  const first = list[idx];
  if (shuffle) shuffleArr(list);
  queue = list; shuffled = shuffle; queueName = name;
  playAt(shuffle ? 0 : list.indexOf(first));
  if (cur().kind !== 'now') push(nowView()); else render();
}

audio.addEventListener('ended', () => {
  if (!current) return;
  if (settings.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  if (qi < queue.length - 1) playAt(qi + 1);
  else if (settings.repeat === 'all') playAt(0);
  else { setAnn(); render(); }
});
audio.addEventListener('error', () => {
  if (!current || audio.src === SILENT) return;
  const t = current;
  if (t.retry < 1) {
    t.retry++;
    freshLink(t).then(h => { if (current === t) setSrc(h); }).catch(e => trackFailed(t, e));
  } else trackFailed(t, null);
});
['play', 'pause', 'playing'].forEach(ev => audio.addEventListener(ev, () => {
  if (ev === 'playing') buffering = false;
  setAnn(); renderFoot(); updatePosition();
}));
audio.addEventListener('waiting', () => { buffering = true; setAnn(); });
audio.addEventListener('loadedmetadata', () => { updateNow(); updatePosition(); });
audio.addEventListener('seeked', updatePosition);
audio.addEventListener('timeupdate', () => {
  updateNow();
  const ft = vfoot.querySelector('.ft-time');
  if (ft) ft.textContent = fmt(audio.currentTime);
});

/* lock screen / control centre */
function updateMeta() {
  if (!('mediaSession' in navigator) || !current) return;
  const p = parseName(current.name, current.folder);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: p.title, artist: p.artist, album: current.folder || 'Дека',
      artwork: [{ src: ART, sizes: '360x360', type: 'image/png' }]
    });
  } catch (e) {}
}
function updatePosition() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const d = audio.duration;
  if (!isFinite(d) || d <= 0) return;
  try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: audio.playbackRate || 1, position: Math.min(audio.currentTime, d) }); } catch (e) {}
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const h = (a, fn) => { try { ms.setActionHandler(a, fn); } catch (e) {} };
  h('play', () => audio.play().catch(() => {}));
  h('pause', () => audio.pause());
  h('previoustrack', prev);
  h('nexttrack', next);
  h('seekto', d => { if (d && isFinite(d.seekTime)) audio.currentTime = d.seekTime; });
  h('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - ((d && d.seekOffset) || 10)); });
  h('seekforward', d => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + ((d && d.seekOffset) || 10)); });
}

/* ---------- display ---------- */
let stack = [];
const cur = () => stack[stack.length - 1];
function push(v) { v.sel = v.sel || 0; v.top = v.top || 0; stack.push(v); render(); if (v.enter) v.enter(v); }
function back() {
  if (stack.length > 1) { stack.pop(); scrubT = null; render(); }
}
function setLoad(on) { loadCount = Math.max(0, loadCount + (on ? 1 : -1)); setAnn(); }
function setAnn() {
  const st = {
    play: !!current && !audio.paused,
    pause: !!current && audio.paused,
    rpt: settings.repeat === 'all',
    rpt1: settings.repeat === 'one',
    shuf: shuffled && !!current,
    load: loadCount > 0 || (buffering && !audio.paused)
  };
  ann.querySelectorAll('span').forEach(s => s.classList.toggle('on', !!st[s.dataset.a]));
  led.classList.toggle('on', st.play);
}
function flash(msg) {
  flashMsg = msg; renderFoot();
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { flashMsg = ''; renderFoot(); }, 1800);
}

function mainView() {
  return {
    kind: 'list', title: 'ГЛАВНОЕ',
    build: () => {
      const it = [
        { label: 'Исполнители', hint: '›', go: () => push(folderView('/', 'Исполнители')) },
        { label: 'Вперемешку всё', hint: '', go: shuffleAll }
      ];
      if (current) it.push({ label: 'Сейчас играет', hint: '›', go: () => push(nowView()) });
      it.push({ label: 'Настройки', hint: '›', go: () => push(settingsView()) });
      return it;
    }
  };
}
function folderView(path, title) {
  const v = { kind: 'list', title: title.toUpperCase(), path, loading: true, error: null, data: null };
  v.build = () => {
    if (v.loading) return [];
    if (v.error) return [{ label: 'Повторить', hint: '', go: () => loadFolder(v) }];
    const dirs = v.data.filter(x => x.dir), files = v.data.filter(x => !x.dir);
    const it = [];
    if (files.length) {
      it.push({ label: 'Слушать все', hint: String(files.length), go: () => startQueue(files, 0, false, title) });
      it.push({ label: 'Вперемешку', hint: '', go: () => startQueue(files, 0, true, title) });
    }
    dirs.forEach(d => it.push({ label: d.name, hint: '›', go: () => push(folderView(d.path, d.name)) }));
    files.forEach((f, i) => it.push({ label: parseName(f.name, f.folder).title, track: f, hint: '', go: () => startQueue(files, i, false, title) }));
    if (!it.length) { v.error = Object.assign(new Error('ПАПКА ПУСТАЯ'), { custom: true }); return []; }
    return it;
  };
  v.enter = () => loadFolder(v);
  return v;
}
async function loadFolder(v) {
  v.loading = true; v.error = null; setLoad(true); render();
  try { v.data = await listFolder(v.path); } catch (e) { v.error = e; }
  v.loading = false; setLoad(false); render();
}
async function shuffleAll() {
  const v = { kind: 'list', title: 'ВСЁ ВПЕРЕМЕШКУ', loading: true, loadMsg: 'СОБИРАЮ ТРЕКИ', error: null, build: () => v.error ? [{ label: 'Повторить', hint: '', go: () => { stack.pop(); shuffleAll(); } }] : [] };
  push(v); setLoad(true);
  try {
    const files = await collectAll((d, t) => { v.loadMsg = 'СОБИРАЮ ТРЕКИ ' + d + '/' + t; if (cur() === v) render(); });
    setLoad(false);
    if (cur() !== v) return;
    if (!files.length) { v.loading = false; v.error = Object.assign(new Error('МУЗЫКИ НЕ НАШЛОСЬ'), { custom: true }); render(); return; }
    stack.pop();
    startQueue(files, 0, true, 'Всё вперемешку');
  } catch (e) {
    setLoad(false); v.loading = false; v.error = e; render();
  }
}
function nowView() { return { kind: 'now', title: 'СЕЙЧАС ИГРАЕТ' }; }
function settingsView() {
  const rep = { all: 'ВСЕ', one: 'ОДИН', off: 'ВЫКЛ' };
  return {
    kind: 'list', title: 'НАСТРОЙКИ',
    build: () => [
      { label: 'Щелчки колеса', hint: settings.clicks ? 'ВКЛ' : 'ВЫКЛ', go: () => { settings.clicks = !settings.clicks; store.set('clicks', settings.clicks); render(); } },
      { label: 'Вибро', hint: settings.haptics ? 'ВКЛ' : 'ВЫКЛ', go: () => { settings.haptics = !settings.haptics; store.set('haptics', settings.haptics); render(); if (settings.haptics) buzz(); } },
      { label: 'Повтор', hint: rep[settings.repeat], go: () => { settings.repeat = { all: 'one', one: 'off', off: 'all' }[settings.repeat]; store.set('repeat', settings.repeat); setAnn(); render(); } },
      { label: 'Папка на Диске', hint: '›', go: () => push(editView()) },
      { label: 'Обновить списки', hint: '', go: () => { cache.clear(); flash('СПИСКИ ОБНОВЯТСЯ'); listFolder('/').catch(() => {}); } }
    ]
  };
}
function editView() { return { kind: 'edit', title: 'ПАПКА НА ДИСКЕ' }; }
function saveKey() {
  const inp = $('keyInput');
  if (!inp) return;
  const val = inp.value.trim();
  if (!/^https?:\/\/(disk\.yandex\.[a-z.]+|yadi\.sk)\//i.test(val)) { flash('НУЖНА ССЫЛКА DISK.YANDEX.RU'); return; }
  settings.key = val; store.set('key', val); cache.clear();
  inp.blur();
  stack = [stack[0]]; render(); flash('ПАПКА СОХРАНЕНА');
  listFolder('/').catch(() => {});
}

function render() {
  const v = cur();
  vtitle.textContent = v.title;
  if (v.kind === 'now') return renderNow();
  if (v.kind === 'edit') return renderEdit();
  vbody.className = 'vfd-body';
  v.sel = v.sel | 0; v.top = v.top | 0;
  const items = v.items = v.build();
  let html = '', reserved = 0;
  if (v.loading) {
    vbody.innerHTML = '<div class="msg">' + esc(v.loadMsg || 'ЗАГРУЗКА') + '<span class="blink">…</span></div>';
    renderFoot(); return;
  }
  if (v.error) {
    const [a, b] = errText(v.error);
    html += '<div class="msg">' + esc(a) + (b ? '<small>' + esc(b) + '</small>' : '') + '</div>';
    reserved = 2;
  }
  const rows = Math.max(2, Math.floor(vbody.clientHeight / ROW) - reserved);
  v.sel = Math.max(0, Math.min(v.sel, items.length - 1));
  if (v.sel < v.top) v.top = v.sel;
  if (v.sel >= v.top + rows) v.top = v.sel - rows + 1;
  v.top = Math.max(0, Math.min(v.top, Math.max(0, items.length - rows)));
  for (let i = v.top; i < Math.min(items.length, v.top + rows); i++) {
    const it = items[i], on = i === v.sel;
    const playing = it.track && current && it.track.path === current.path;
    html += '<div class="row' + (on ? ' on' : '') + '" data-i="' + i + '"><span class="car">' + (on ? '▸' : '') +
      '</span><span class="lbl"><span class="txt">' + esc(it.label) + '</span></span><span class="hint">' +
      (playing ? (audio.paused ? '‖' : '♪') : esc(it.hint || '')) + '</span></div>';
  }
  if (items.length > rows) {
    html += '<div class="sb"><i style="top:' + (v.top / items.length * 100) + '%;height:' + (rows / items.length * 100) + '%"></i></div>';
  }
  vbody.innerHTML = html;
  marquee();
  renderFoot();
}
function marquee() {
  if (reduceMotion) return;
  const t = vbody.querySelector('.row.on .txt');
  if (!t) return;
  const over = t.scrollWidth - t.parentElement.clientWidth;
  if (over > 4) {
    t.style.setProperty('--shift', (-over - 16) + 'px');
    t.style.setProperty('--dur', Math.max(3, over / 28).toFixed(1) + 's');
    t.classList.add('mq');
  }
}
let segEls = null, npEl = null, npRem = null;
function renderNow() {
  vbody.className = 'vfd-body';
  if (!current) {
    vbody.innerHTML = '<div class="msg">НЕТ ТРЕКА<small>Выбери исполнителя в меню</small></div>';
    segEls = null; renderFoot(); return;
  }
  const p = parseName(current.name, current.folder);
  vbody.innerHTML =
    '<div class="np"><div class="np-meta"><span>ТРЕК ' + (qi + 1) + ' / ' + queue.length + '</span><span>' + esc(current.folder || queueName) + '</span></div>' +
    '<div class="np-mid"><div class="np-artist">' + esc(p.artist) + '</div><div class="np-title">' + esc(p.title) + '</div></div>' +
    '<div class="np-bar">' + '<i></i>'.repeat(SEGS) + '</div>' +
    '<div class="np-time"><span id="npEl">00:00</span><span id="npRem">-00:00</span></div></div>';
  segEls = vbody.querySelectorAll('.np-bar i'); npEl = $('npEl'); npRem = $('npRem');
  updateNow(); renderFoot();
}
function updateNow() {
  if (cur().kind !== 'now' || !current || !segEls) return;
  const d = audio.duration, t = scrubT != null ? scrubT : audio.currentTime;
  npEl.textContent = fmt(t);
  npEl.classList.toggle('scrub', scrubT != null);
  npRem.textContent = isFinite(d) ? '-' + fmt(Math.max(0, d - t)) : '--:--';
  const lit = isFinite(d) && d > 0 ? Math.round(t / d * SEGS) : 0;
  segEls.forEach((s, i) => s.classList.toggle('on', i < lit));
}
function renderEdit() {
  if ($('keyInput')) return;
  vbody.className = 'vfd-body';
  vbody.innerHTML =
    '<form class="edit" id="editForm"><label for="keyInput">Публичная ссылка на папку</label>' +
    '<input id="keyInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div class="edit-row"><button class="vbtn primary" type="submit">Сохранить</button><button class="vbtn" type="button" id="resetKey">Стандартная</button></div>' +
    '<small>На Диске: папка → Поделиться → Скопировать ссылку. Подойдёт любая публичная папка с музыкой.</small></form>';
  $('keyInput').value = settings.key;
  $('editForm').addEventListener('submit', e => { e.preventDefault(); tick(true); saveKey(); });
  $('resetKey').addEventListener('click', () => { tick(true); $('keyInput').value = DEFAULT_KEY; });
  renderFoot();
}
function renderFoot() {
  if (flashMsg) { vfoot.className = 'vfd-foot flash'; vfoot.textContent = flashMsg; return; }
  vfoot.className = 'vfd-foot';
  const v = cur();
  if (v && v.kind === 'now') {
    vfoot.textContent = current ? 'КРУТИ — ПЕРЕМОТКА · ЦЕНТР — ПАУЗА' : '';
    return;
  }
  if (!current) { vfoot.textContent = 'КРУТИ КОЛЕСО · ЖМИ ЦЕНТР'; return; }
  const p = parseName(current.name, current.folder);
  vfoot.innerHTML = '<span>' + (audio.paused ? '‖' : '♪') + '</span><span class="ft-txt">' + esc(p.artist + ' — ' + p.title) +
    '</span><span class="ft-time">' + fmt(audio.currentTime) + '</span>';
}

/* ---------- controls ---------- */
let scrubT = null, scrubTimer = 0;
function scrub(dir) {
  const d = audio.duration;
  if (!isFinite(d)) return false;
  scrubT = Math.max(0, Math.min(d - 1, (scrubT != null ? scrubT : audio.currentTime) + dir * 5));
  updateNow();
  clearTimeout(scrubTimer);
  scrubTimer = setTimeout(() => { try { audio.currentTime = scrubT; } catch (e) {} scrubT = null; updateNow(); }, 450);
  return true;
}
function step(dir) {
  const v = cur();
  if (v.kind === 'list') {
    const items = v.items || [];
    if (!items.length) return;
    const n = Math.max(0, Math.min(items.length - 1, v.sel + dir));
    if (n === v.sel) return;       // hard stop at the ends: no click
    v.sel = n; tick(false); render();
  } else if (v.kind === 'now') {
    if (current && scrub(dir)) tick(false);
  }
}
function select() {
  const v = cur();
  if (v.kind === 'list') { const it = (v.items || [])[v.sel]; if (it && it.go) it.go(); }
  else if (v.kind === 'now') togglePlay();
  else if (v.kind === 'edit') saveKey();
}

let rot = 0, acc = 0, lastA = 0, dragId = null;
function angleOf(e) {
  const r = knob.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  return { a: Math.atan2(dy, dx) * 180 / Math.PI, dist: Math.hypot(dx, dy), size: r.width };
}
function turn(d) {
  rot += d; acc += d;
  face.style.transform = 'rotate(' + rot.toFixed(2) + 'deg)';
  while (acc >= STEP) { acc -= STEP; step(1); }
  while (acc <= -STEP) { acc += STEP; step(-1); }
}
knob.addEventListener('pointerdown', e => {
  if (e.target === cap) return;
  unlock();
  dragId = e.pointerId;
  try { knob.setPointerCapture(e.pointerId); } catch (err) {}
  lastA = angleOf(e).a; acc = 0;
  e.preventDefault();
});
knob.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const { a, dist, size } = angleOf(e);
  let d = a - lastA;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  lastA = a;
  if (dist < size * 0.12) return;   // too close to the centre: angle is noise
  turn(d);
});
const endDrag = e => { if (e.pointerId === dragId) dragId = null; };
knob.addEventListener('pointerup', endDrag);
knob.addEventListener('pointercancel', endDrag);
let wheelAcc = 0;
knob.addEventListener('wheel', e => {
  e.preventDefault(); ensureAudioCtx();
  wheelAcc += e.deltaY;
  while (wheelAcc >= 40) { wheelAcc -= 40; turn(STEP); }
  while (wheelAcc <= -40) { wheelAcc += 40; turn(-STEP); }
}, { passive: false });

cap.addEventListener('click', () => { unlock(); tick(true); select(); });
$('kMenu').addEventListener('click', () => { unlock(); tick(true); back(); });
$('kPrev').addEventListener('click', () => { unlock(); tick(true); prev(); });
$('kNext').addEventListener('click', () => { unlock(); tick(true); next(); });
$('kPlay').addEventListener('click', () => { unlock(); tick(true); togglePlay(); });
vbody.addEventListener('click', e => {
  const row = e.target.closest('.row');
  const v = cur();
  if (!row || v.kind !== 'list') return;
  unlock();
  v.sel = +row.dataset.i; tick(true); render();
  const it = v.items[v.sel];
  if (it && it.go) it.go();
});
document.addEventListener('pointerdown', unlock, { capture: true, passive: true });
document.addEventListener('touchstart', () => {}, { passive: true });   // enables :active on iOS
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT') return;
  const k = e.key;
  if (k === 'ArrowDown') { turn(STEP); e.preventDefault(); }
  else if (k === 'ArrowUp') { turn(-STEP); e.preventDefault(); }
  else if (k === 'Enter' && tag !== 'BUTTON') { tick(true); select(); e.preventDefault(); }
  else if (k === 'Escape' || k === 'Backspace') { tick(true); back(); e.preventDefault(); }
  else if (k === ' ' && tag !== 'BUTTON') { togglePlay(); e.preventDefault(); }
  else if (k === 'ArrowRight') next();
  else if (k === 'ArrowLeft') prev();
});
window.addEventListener('resize', () => { if (cur().kind === 'list') render(); });

/* ---------- boot ---------- */
(function buildScale() {
  let s = '';
  for (let i = 0; i < 24; i++) {
    const a = (i * STEP - 90) * Math.PI / 180, maj = i % 6 === 0;
    const r1 = maj ? 84 : 86, r2 = maj ? 96 : 92;
    s += '<line' + (maj ? ' class="maj"' : '') + ' x1="' + (100 + r1 * Math.cos(a)).toFixed(2) + '" y1="' + (100 + r1 * Math.sin(a)).toFixed(2) +
      '" x2="' + (100 + r2 * Math.cos(a)).toFixed(2) + '" y2="' + (100 + r2 * Math.sin(a)).toFixed(2) + '"/>';
  }
  $('scale').innerHTML = s;
})();
stack = [mainView()];
setAnn();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (cur().kind === 'list') render(); });
listFolder('/').catch(() => {});   // warm the artist list

window.__deka = { parseName };
})();
</script>
</body>
