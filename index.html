<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VibePod">
<meta name="description" content="VibePod — музыкальный плеер для публичных папок Яндекс Диска с избранным и сохранением треков для прослушивания без интернета">
<meta name="theme-color" content="#1b1e22">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" sizes="192x192" href="vibepod-icon-v2-192.png">
<link rel="icon" type="image/png" href="vibepod-icon-v2-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>VibePod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jura:wght@500;600;700&family=Unbounded:wght@700;800&display=swap">
<script>
(() => {
  let mode = 'system';
  try { mode = JSON.parse(localStorage.getItem('deka.theme')) || 'system'; } catch (_) {}
  if (!['system', 'light', 'dark'].includes(mode)) mode = 'system';
  const dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  let accent = 'blue';
  try { accent = JSON.parse(localStorage.getItem('deka.accent')) || 'blue'; } catch (_) {}
  document.documentElement.dataset.accent = ['blue','mint','violet','rose','amber','graphite'].includes(accent) ? accent : 'blue';
  document.querySelector('meta[name="theme-color"]').content = dark ? '#17181b' : '#f5f5f3';
})();
</script>
<style>
/* VibePod: LCD-style display and stationary Click Wheel; 24 gesture steps per turn. */
:root{
  --row:34px; --rowf:17px;   /* list row height and text size; larger on a computer screen */
  --dw:100vw; --dh:100vh;   /* the deck's own width/height; swapped by script when the phone is turned */
  --room:#e1e3e6;
  --plate:#f5f5f3; --plate-hi:#ffffff; --plate-lo:#e8e8e6;
  --silk:#20252b; --silk-dim:#4d5660; --engrave:#535b65; --engrave-dim:#69727b;
  --glass:#eef2f4; --glass-hi:#ffffff; --glow:#145dba; --dim:#455565; --ghost:#d4dce3;
  --halo:none; --selected:#1763bd; --selected-text:#ffffff; --error:#b32c26;
  --wheel-bg:#e4e5e4; --wheel-border:#cbcdcc; --wheel-text:#62696e;
  --wheel-highlight:rgba(255,255,255,.8); --wheel-press:rgba(0,0,0,.08);
  --cap-bg:linear-gradient(#fafbf9,#efefec); --button-bg:rgba(20,93,186,.09);
  --screen-shadow:inset 0 0 0 2px #555b60,inset 0 2px 6px rgba(0,0,0,.12);
  --f-brand:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-vfd:"Jura","Trebuchet MS",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --room:#0b0c0f; --plate:#17181b; --plate-hi:#25262a; --plate-lo:#101114;
  --silk:#f1f3f5; --silk-dim:#bec4cc; --engrave:#b0b6be; --engrave-dim:#89919b;
  --glass:#111a21; --glass-hi:#1e2b35; --glow:#83c8ff; --dim:#c1cbd4; --ghost:#35434e;
  --selected:#27689d; --selected-text:#ffffff; --error:#ffb0a8;
  --wheel-bg:#292b2f; --wheel-border:#36393e; --wheel-text:#d4d7dd;
  --wheel-highlight:rgba(255,255,255,.05); --wheel-press:rgba(255,255,255,.08);
  --cap-bg:linear-gradient(#25272b,#1c1e21); --button-bg:rgba(131,200,255,.12);
  --screen-shadow:inset 0 0 0 2px #080b0e,inset 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* the canvas takes the plate's bottom colour, so no strip of another grey can show under the deck */
html{background:var(--plate-lo)}
body{
  background:transparent;color:var(--engrave);font-family:var(--f-mono);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
.deck{
  /* pinned to all four edges: in a home-screen app 100vh/100dvh can come up short by the status bar */
  position:fixed;inset:0;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:
    linear-gradient(180deg,var(--plate-hi),var(--plate) 45%,var(--plate-lo));
}
@media (min-width:560px) and (min-height:600px){
  body{background:var(--room);display:grid;place-items:center}
  .deck{position:relative;inset:auto;width:440px;height:min(920px,calc(100dvh - 48px));border-radius:30px;
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
}


/* VFD window */
.vfd{
  position:relative;flex:1 1 auto;min-height:170px;display:flex;flex-direction:column;gap:6px;
  padding:10px 12px 9px;border-radius:12px;overflow:hidden;
  background:linear-gradient(var(--glass-hi),var(--glass));
  box-shadow:var(--screen-shadow);
  color:var(--glow);font-family:var(--f-vfd);
}
.vfd-title.can-back{cursor:pointer;color:var(--glow)}
.vfd-title.can-back:focus-visible{outline:1px solid var(--glow);outline-offset:2px;border-radius:3px}
.vfd-title .bk{font-size:15px;line-height:0;margin-right:2px}
.vfd{touch-action:none}
.vfd-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--ghost);padding-bottom:5px}
.vfd-title{flex:1 1 auto;min-width:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfd-brand{flex:0 0 auto;font-family:var(--f-brand);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim);user-select:none}
.vfd-body{position:relative;flex:1 1 auto;min-height:0}
.row{display:flex;align-items:center;gap:6px;height:var(--row);padding:0 8px;cursor:pointer;
  font-weight:600;font-size:var(--rowf);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.row.on{color:var(--selected-text);background:var(--selected);border-radius:3px;text-shadow:none}
.row.on .lbl{-webkit-mask-image:none;mask-image:none}
.car{flex:0 0 12px;width:12px}
.lbl{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}
.txt{display:inline-block;white-space:nowrap}
.txt.mq{animation:mq var(--dur,6s) linear .8s infinite alternate}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--shift,0))}}
.hint{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em}
.sb{position:absolute;right:0;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--ghost)}
.sb i{position:absolute;left:0;right:0;border-radius:2px;background:var(--glow);box-shadow:none}
.msg{display:flex;flex-direction:column;gap:6px;padding:12px 0 10px;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:var(--halo)}
.msg small{font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--dim);text-shadow:none}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

/* now playing */
.np{display:flex;flex-direction:column;height:100%;gap:8px;padding-top:2px}
.np-meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--dim)}
.np-meta span:first-child{flex:0 0 auto;white-space:nowrap}
.np-meta span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.np-mid{margin-block:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.np-artist{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-title{font-size:clamp(21px,calc(var(--dw) * .066),29px);font-weight:700;line-height:1.08;letter-spacing:.02em;text-transform:uppercase;text-shadow:var(--halo);
  text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.np-err{font-family:var(--f-mono);font-size:10.5px;line-height:1.45;letter-spacing:.02em;color:var(--glow);overflow-wrap:anywhere;text-transform:none}
.np-actions{display:flex;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.np-actions .vbtn{min-width:0;max-width:100%;justify-content:center;display:inline-flex;align-items:center;gap:6px;text-decoration:none;touch-action:manipulation;padding:8px 11px}
.vbtn.on{background:var(--button-bg);border-color:var(--glow);text-shadow:var(--halo)}
.vbtn.off{opacity:.45;pointer-events:none}
.np-bar{display:grid;grid-template-columns:repeat(32,1fr);gap:2px;height:10px;flex:0 0 auto}
.np-bar i{background:var(--ghost)}
.np-bar i.on{background:var(--glow);box-shadow:none}
.np-time{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;text-shadow:var(--halo)}
.np-time .scrub{animation:blink .7s steps(2) infinite}

/* folder link editor */
.edit{max-height:100%;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding-top:8px;font-family:var(--f-mono)}
.edit label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.edit input{width:100%;min-width:0;font:500 15px/1.3 var(--f-mono);color:var(--glow);background:var(--button-bg);
  border:1px solid var(--dim);border-radius:6px;padding:10px;-webkit-user-select:text;user-select:text;outline:none}
.edit input.bad{border-color:var(--error);box-shadow:0 0 0 3px rgba(255,138,122,.18)}
.edit input:focus{border-color:var(--glow);box-shadow:0 0 0 3px var(--button-bg)}
.edit-err{font-size:11px;line-height:1.4;color:var(--error)}
.edit-err[hidden]{display:none}
.edit-row{display:flex;gap:8px;flex-wrap:wrap}
.vbtn{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--glow);background:transparent;
  border:1px solid var(--dim);border-radius:5px;padding:9px 12px;cursor:pointer}
.vbtn.primary{background:var(--button-bg);text-shadow:var(--halo)}
.vbtn:focus-visible{outline:2px solid var(--glow);outline-offset:2px;box-shadow:0 0 0 3px var(--button-bg)}
.edit small{font-size:11px;line-height:1.45;color:var(--dim)}



/* Stationary matte Click Wheel: gesture geometry is independent of its artwork. */
.dial-zone{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0}
.dial{position:relative;width:min(calc(var(--dw) * .78),calc(var(--dh) * .4),320px);max-width:100%;aspect-ratio:1}
.knob{position:absolute;inset:4%;border-radius:50%;touch-action:none;cursor:grab;background:var(--wheel-bg);border:1px solid var(--wheel-border);box-shadow:inset 0 1px 2px var(--wheel-highlight),0 1px 2px rgba(0,0,0,.08)}
.knob:active{cursor:grabbing}
.knob-face{position:absolute;inset:0;border-radius:50%;pointer-events:none;transition:background .12s}
.knob.t-up .knob-face{background:linear-gradient(180deg,var(--wheel-press),transparent 48%)}
.knob.t-down .knob-face{background:linear-gradient(0deg,var(--wheel-press),transparent 48%)}
.knob.t-left .knob-face{background:linear-gradient(90deg,var(--wheel-press),transparent 48%)}
.knob.t-right .knob-face{background:linear-gradient(270deg,var(--wheel-press),transparent 48%)}
.wheel-labels{position:absolute;inset:0;pointer-events:none;color:var(--wheel-text);font:700 12px/1 Arial,sans-serif;letter-spacing:.06em}
.wheel-labels span{position:absolute;display:grid;place-items:center}
.wheel-labels svg{display:block;width:23px;height:20px;fill:currentColor}
.wl-menu{top:15%;left:50%;transform:translate(-50%,-50%)}
.wl-left{left:15%;top:50%;transform:translate(-50%,-50%)}
.wl-right{left:85%;top:50%;transform:translate(-50%,-50%)}
.wl-play{left:50%;top:85%;transform:translate(-50%,-50%)}
.cap{position:absolute;inset:31%;border-radius:50%;border:1px solid var(--wheel-border);cursor:pointer;touch-action:manipulation;padding:0;background:var(--cap-bg);box-shadow:inset 0 1px 2px var(--wheel-highlight),0 1px 2px rgba(0,0,0,.09);transition:box-shadow .12s,transform .12s}
.cap:active{transform:scale(.98);box-shadow:inset 0 2px 5px rgba(0,0,0,.15)}
.cap.armed{box-shadow:0 0 0 3px var(--glow),inset 0 1px 3px rgba(0,0,0,.15)}
.cap:focus-visible,.knob:focus-visible{outline:3px solid var(--glow);outline-offset:4px}
@media (max-height:580px) and (orientation:portrait){.dial{width:min(calc(var(--dw) * .68),calc(var(--dh) * .32),270px)}}

/* Landscape: the deck lies on its side - display fills the left, the wheel sits on the right */
@media (orientation:landscape){
  .deck{flex-direction:row;align-items:stretch;gap:clamp(14px,3vw,40px);max-width:none;
    padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 16px)}
  .vfd{flex:1 1 auto;min-width:0;min-height:0}
  .dial-zone{padding-inline:clamp(0px,1vw,16px)}
  .dial{width:min(calc(var(--dh) * .68),calc(var(--dw) * .38),420px)}
  .np-artist{font-size:clamp(15px,calc(var(--dh) * .026),22px)}
  .np-title{font-size:clamp(21px,calc(var(--dh) * .056),46px)}
  .np-time{font-size:clamp(22px,calc(var(--dh) * .038),34px)}
}
/* computer or tablet: a framed device that uses most of the window */
@media (orientation:landscape) and (min-width:900px) and (min-height:500px){
  .deck{position:relative;inset:auto;width:calc(100vw - 48px);max-width:1500px;height:calc(100dvh - 48px);max-height:940px;
    border-radius:30px;padding:24px 36px 24px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
  :root{--row:48px;--rowf:23px}
  .vfd{padding:16px 22px 14px;gap:10px}
  .vfd-title,.np-meta{font-size:13px}
  .vfd-brand{font-size:11px}
  .vfd-title .bk{font-size:18px}
  .np-actions .vbtn{font-size:13px;padding:10px 14px}
  .np-bar{height:14px}
}
@media (max-height:440px){
  .deck{gap:12px}.np{gap:4px}.np-mid{gap:3px}
  .np-title{-webkit-line-clamp:2;font-size:22px}.np-time{font-size:20px}
  .np-actions .vbtn{padding:7px 9px}.vfd{padding:9px 10px}
}
@media (prefers-reduced-motion:reduce){.txt.mq,.blink,.np-time .scrub{animation:none}.knob-face,.cap{transition:none}}

/* Base accent colours; light-mode pastel overrides follow below. */
:root[data-accent="mint"]{--glow:#17664f;--selected:#206b53;--button-bg:rgba(32,107,83,.1)}
:root[data-theme="dark"][data-accent="mint"]{--glow:#80dec0;--button-bg:rgba(32,107,83,.25)}
:root[data-accent="violet"]{--glow:#7041ad;--selected:#7041ad;--button-bg:rgba(112,65,173,.1)}
:root[data-theme="dark"][data-accent="violet"]{--glow:#cfb2ff;--button-bg:rgba(112,65,173,.25)}
:root[data-accent="rose"]{--glow:#a32c64;--selected:#a32c64;--button-bg:rgba(163,44,100,.1)}
:root[data-theme="dark"][data-accent="rose"]{--glow:#ffb0d4;--button-bg:rgba(163,44,100,.25)}
:root[data-accent="amber"]{--glow:#98460d;--selected:#98460d;--button-bg:rgba(152,70,13,.1)}
:root[data-theme="dark"][data-accent="amber"]{--glow:#ffd095;--button-bg:rgba(152,70,13,.25)}
:root[data-accent="graphite"]{--glow:#475569;--selected:#475569;--button-bg:rgba(71,85,105,.1)}
:root[data-theme="dark"][data-accent="graphite"]{--glow:#d0d9e5;--button-bg:rgba(71,85,105,.25)}
.color-chip{flex:0 0 11px;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.vfd.reading{touch-action:pan-y}
.help{height:100%;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;padding:2px 6px 12px 2px;color:var(--dim);font:14px/1.65 var(--f-vfd);-webkit-user-select:text;user-select:text}
.help p{margin:0 0 16px}.help p:last-child{margin-bottom:0}
.help:focus-visible{outline:2px solid var(--glow);outline-offset:-2px}
.share{margin-left:auto;flex:0 0 auto!important;min-width:38px!important;min-height:32px;padding:6px!important}
.share svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.welcome{height:100%;overflow:auto;touch-action:pan-y;color:var(--dim);font:14px/1.6 var(--f-vfd);padding:12px 4px}
.welcome h1{font-size:26px;line-height:1.2;color:var(--glow);margin:0 0 20px}.welcome p{margin:0 0 16px}.welcome-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Pastel accents only in light mode; dark palette stays unchanged. */
:root:not([data-theme="dark"])[data-accent="blue"]{--glow:#326aa1;--selected:#d5e9fc;--selected-text:#326aa1;--button-bg:#d5e9fc;--accent-swatch:#d5e9fc}
:root:not([data-theme="dark"])[data-accent="mint"]{--glow:#286e5b;--selected:#d5eee3;--selected-text:#286e5b;--button-bg:#d5eee3;--accent-swatch:#d5eee3}
:root:not([data-theme="dark"])[data-accent="violet"]{--glow:#79539e;--selected:#eadff7;--selected-text:#79539e;--button-bg:#eadff7;--accent-swatch:#eadff7}
:root:not([data-theme="dark"])[data-accent="rose"]{--glow:#a04d74;--selected:#f8deea;--selected-text:#a04d74;--button-bg:#f8deea;--accent-swatch:#f8deea}
:root:not([data-theme="dark"])[data-accent="amber"]{--glow:#8a6028;--selected:#f8e8c9;--selected-text:#8a6028;--button-bg:#f8e8c9;--accent-swatch:#f8e8c9}
:root:not([data-theme="dark"])[data-accent="graphite"]{--glow:#586777;--selected:#e1e7ed;--selected-text:#586777;--button-bg:#e1e7ed;--accent-swatch:#e1e7ed}
:root:not([data-theme="dark"]) .color-chip{background:var(--light-swatch)!important}
</style>
</head>
<body>
<main class="deck">
  <section class="vfd" aria-live="polite">
    <div class="vfd-head">
      <div class="vfd-title" id="vtitle">ГЛАВНОЕ</div>
      <div class="vfd-brand" aria-label="VibePod">VIBEPOD</div>
    </div>
    <div class="vfd-body" id="vbody"></div>
  </section>

  <div class="dial-zone">
    <div class="dial">
      <div class="knob" id="knob" role="group" aria-label="Колесо управления: вращение — выбор, края: сверху — назад, снизу — пуск и пауза, слева и справа — переключение треков" tabindex="0">
        <div class="knob-face" id="knobFace"></div>
        <div class="wheel-labels" aria-hidden="true">
          <span class="wl-menu">MENU</span>
          <span class="wl-left"><svg viewBox="0 0 24 20"><path d="M3 3h3v14H3zM17 3v14L6 10zM24 3v14L13 10z"/></svg></span>
          <span class="wl-right"><svg viewBox="0 0 24 20"><path d="M18 3h3v14h-3zM7 3l11 7-11 7zM0 3l11 7L0 17z"/></svg></span>
          <span class="wl-play"><svg viewBox="0 0 24 20"><path d="M1 3l10 7-10 7zM14 3h3v14h-3zM20 3h3v14h-3z"/></svg></span>
        </div>
        <button class="cap" id="cap" type="button" aria-label="Центр: открыть или пауза; удержание — в избранное"></button>
      </div>
    </div>
  </div>
</main>
<audio id="audio" preload="auto" playsinline></audio>

<script>
(() => {
'use strict';

const DEFAULT_KEY = 'https://disk.yandex.ru/d/boUVJ0ImtvHbKg';
const API = 'https://cloud-api.yandex.net/v1/disk/public/resources';
const STEP = 15;          // degrees per detent, 24 detents per turn
const rowH = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row')) || 34;           // list row height in px

  input.style.display = 'none'; document.body.appendChild(input);

          !Array.isArray(data.downloadedReferences)) throw Error('Неверный формат копии');

          throw Error('Некорректное избранное');

          if (!f || typeof f.p !== 'string' || typeof f.n !== 'string' ||
              f.p.length > 4096 || f.n.length > 1000) throw Error('Некорректный трек');
          return { p: f.p, n: f.n, f: typeof f.f === 'string' ? f.f : '',
            m: typeof f.m === 'string' ? f.m : '', s: Number(f.s) || 0,
            at: Number(f.at) || 0 };

      }
      const refs = data.downloadedReferences.map(f => {

            s: Number(f.size) || 0, at: Number(f.downloadedAt) || 0 });
      }

          themeMode = data.appearance.theme;

      store.set('clicks2', settings.clicks); store.set('repeat', settings.repeat);

      stack = [mainView()]; render();

    } catch (e) { alert('Не удалось восстановить копию: ' + e.message); }

  });

}

  }
  if (items.length > rows) {
    html += '<div class="sb"><i style="top:' + (v.top / items.length * 100) + '%;height:' + (rows / items.length * 100) + '%"></i></div>';
  }
  vbody.innerHTML = html;
  marquee();
  }
function marquee() {
  if (reduceMotion) return;
  const t = vbody.querySelector('.row.on .txt');
  if (!t) return;
  const over = t.scrollWidth - t.parentElement.clientWidth;
  if (over > 4) {
    t.style.setProperty('--shift', (-over - 16) + 'px');
    t.style.setProperty('--dur', Math.max(3, over / 28).toFixed(1) + 's');
    t.classList.add('mq');
  }
}
let segEls = null, npEl = null, npRem = null;
function renderNow() {
  vbody.className = 'vfd-body';
  if (!current) {
    vbody.innerHTML = '<div class="msg">НЕТ ТРЕКА<small>Выбери исполнителя в меню</small></div>';
    segEls = null; return;
  }
  const p = parseName(current.name, artistOf(current));
  vbody.innerHTML =
    '<div class="np"><div class="np-meta"><span>ТРЕК ' + (qi + 1) + ' / ' + queue.length + '</span><span>' + esc(current.folder || queueName) + '</span></div>' +
    '<div class="np-mid"><div class="np-artist">' + (isFav(current) ? HEART + ' ' : '') + esc(p.artist) + '</div><div class="np-title">' + esc(p.title) + '</div>' +
    (current.gaveUp ? '<div class="np-err">' + esc(current.status) + '<br>' + esc(current.err) + '</div>' : '') + '</div>' +
    '<div class="np-actions"><button type="button" class="vbtn" id="npAct"></button><button type="button" class="vbtn share" id="shareTrack" aria-label="Поделиться треком" title="Поделиться треком"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 13v7h14v-7"/></svg></button></div>' +
    '<div class="np-bar">' + '<i></i>'.repeat(SEGS) + '</div>' +
    '<div class="np-time"><span id="npEl">00:00</span><span id="npRem">-00:00</span></div></div>';
  segEls = vbody.querySelectorAll('.np-bar i'); npEl = $('npEl'); npRem = $('npRem');
  wireAct($('npAct'));
  $('shareTrack').addEventListener('click', shareTrack);
  updateDl();
  updateNow(); }
/* "Скачать" saves the track into the player's own storage; a second tap on "в памяти" offers removal. */
/* One button on the track screen.
   ♡ В ИЗБРАННОЕ → (now ♥) СКАЧАТЬ → progress → В ПАМЯТИ → tap again to offer removal from memory.
   Holding the button (or the centre of the wheel) takes the track out of favourites. */
let delArm = null, delTimer = 0;
function updateDl() {
  const b = $('npAct'), t = current;
  if (!b || !t) return;
  const fav = isFav(t), st = dlState(t);
  b.classList.toggle('on', fav || st === 'saved');
  const h = fav ? HEART + ' ' : '';
  if (st === 'saved') { b.textContent = h + (delArm === t ? 'УДАЛИТЬ ИЗ ПАМЯТИ?' : 'В ПАМЯТИ ✓'); return; }
  if (st === 'busy') { b.textContent = h + 'ЗАГРУЗКА ' + Math.round((t.dlProgress || 0) * 100) + '%'; return; }
  if (st === 'queued') { b.textContent = h + 'В ОЧЕРЕДИ'; return; }
  if (!fav) { b.textContent = '♡ В ИЗБРАННОЕ'; return; }
  b.textContent = h + (t.dlFail && Date.now() - t.dlFail < 4000 ? (dlErr === 'НЕТ МЕСТА' ? 'НЕТ МЕСТА' : 'ОШИБКА, ЕЩЁ РАЗ') : 'СКАЧАТЬ ↓');
}
/* Tap: ♡ → favourite → download → (in memory) ask → delete. A track already in memory always offers deletion,
   even if it was downloaded before it became a favourite. Hold: add to / remove from favourites. */
function actButton() {
  const t = current;
  if (!t) return;
  const st = dlState(t);
  if (st === 'saved') {
    clearTimeout(delTimer);
    if (delArm === t) { delArm = null; removeSaved(t).then(render); }
    else { delArm = t; delTimer = setTimeout(() => { delArm = null; updateDl(); }, 3000); updateDl(); }
    return;
  }
  if (st !== 'none') return;
  if (!isFav(t)) { toggleFav(t); render(); return; }
  queueDownload([t]);
}
function wireAct(b) {
  let holdTimer = 0, held = false;
  b.addEventListener('pointerdown', () => {
    held = false; clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      held = true;
      if (current) { delArm = null; toggleFav(current); tick(true); render(); }
    }, 550);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => clearTimeout(holdTimer)));
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('click', e => {
    e.stopPropagation(); unlock();
    if (held) { held = false; return; }
    tick(true); actButton();
  });
}
function updateNow() {
  if (cur().kind !== 'now' || !current || !segEls) return;
  if (current.retrying || (current.mode && !current.started && !audio.currentTime && !current.blobP && !current.gaveUp && audio.readyState < 2)) {
    npEl.textContent = '··:··'; npEl.classList.remove('scrub'); npRem.textContent = 'ЗАГРУЗКА';
    segEls.forEach(s => s.classList.remove('on'));
    return;
  }
  if (current.blobP && !current.blobUrl) {          // whole-track download in progress
    const pr = current.progress || 0, litDl = Math.round(pr * SEGS);
    npEl.textContent = Math.round(pr * 100) + '%';
    npEl.classList.remove('scrub');
    npRem.textContent = 'ЗАГРУЗКА';
    segEls.forEach((s, i) => s.classList.toggle('on', i < litDl));
    return;
  }
  const d = audio.duration, t = scrubT != null ? scrubT : audio.currentTime;
  npEl.textContent = fmt(t);
  npEl.classList.toggle('scrub', scrubT != null);
  npRem.textContent = isFinite(d) ? '-' + fmt(Math.max(0, d - t)) : '--:--';
  const lit = isFinite(d) && d > 0 ? Math.round(t / d * SEGS) : 0;
  segEls.forEach((s, i) => s.classList.toggle('on', i < lit));
}
function renderEdit() {
  if ($('keyInput')) return;
  vbody.className = 'vfd-body';
  vbody.innerHTML =
    '<form class="edit" id="editForm" novalidate><label for="folderName">Название</label>' +
    '<input id="folderName" type="text" maxlength="60" autocomplete="off" placeholder="Необязательно">' +
    '<label for="keyInput">Ссылка Яндекс Диска</label>' +
    '<input id="keyInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-invalid="false" aria-describedby="keyErr">' +
    '<div class="edit-err" id="keyErr" role="alert" hidden></div>' +
    '<div class="edit-row"><button class="vbtn primary" type="submit">Добавить</button><button class="vbtn" type="button" id="resetKey">Стандартная</button></div></form>';
  $('keyInput').addEventListener('input', () => {
    $('keyInput').classList.remove('bad'); $('keyInput').setAttribute('aria-invalid', 'false');
    $('keyErr').textContent = ''; $('keyErr').hidden = true;
  });
  $('editForm').addEventListener('submit', e => { e.preventDefault(); tick(true); saveKey(); });
  $('resetKey').addEventListener('click', () => { tick(true); $('keyInput').value = DEFAULT_KEY; });
}

/* ---------- controls ---------- */
let scrubT = null, scrubTimer = 0;
function scrub(dir) {
  const d = audio.duration;
  if (!isFinite(d)) return false;
  scrubT = Math.max(0, Math.min(d - 1, (scrubT != null ? scrubT : audio.currentTime) + dir * 5));
  updateNow();
  clearTimeout(scrubTimer);
  scrubTimer = setTimeout(() => { try { audio.currentTime = scrubT; } catch (e) {} scrubT = null; updateNow(); }, 450);
  return true;
}
function step(dir) {
  const v = cur();
  if (v.kind === 'list') {
    const items = v.items || [];
    if (!items.length) return;
    const n = Math.max(0, Math.min(items.length - 1, v.sel + dir));
    if (n === v.sel) return;       // hard stop at the ends: no click
    v.sel = n; tick(false); render();
  } else if (v.kind === 'now') {
    if (current && scrub(dir)) tick(false);
  } else if (v.kind === 'help') {
    const article = vbody.querySelector('.help');
    if (article) article.scrollTop += dir * 36;
  }
}
function select() {
  const v = cur();
  if (v.kind === 'list') { const it = (v.items || [])[v.sel]; if (it && it.go) it.go(); }
  else if (v.kind === 'now') togglePlay();
  else if (v.kind === 'edit') saveKey();
  else if (v.kind === 'welcome') { store.set('onboarded',true); back(); }
}

let rot = 0, acc = 0, lastA = 0, dragId = null, downX = 0, downY = 0, downA = 0, moved = 0;
const screenRot = 0;
function angleOf(e) {
  const r = knob.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  return { a: Math.atan2(dy, dx) * 180 / Math.PI, dist: Math.hypot(dx, dy), size: r.width };
}
function turn(d) {
  rot += d; acc += d;
  // Click Wheel labels and face remain stationary; acc still tracks the gesture.
  while (acc >= STEP) { acc -= STEP; step(1); }
  while (acc <= -STEP) { acc += STEP; step(-1); }
}
knob.addEventListener('pointerdown', e => {
  if (cap.contains(e.target)) return;
  unlock();
  dragId = e.pointerId;
  try { knob.setPointerCapture(e.pointerId); } catch (err) {}
  const g = angleOf(e);
  lastA = downA = g.a; acc = 0; moved = 0; downX = e.clientX; downY = e.clientY;
  e.preventDefault();
});
knob.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const { a, dist, size } = angleOf(e);
  let d = a - lastA;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  lastA = a;
  if (dist < size * 0.12) return;   // too close to the centre: angle is noise
  moved += d;
  turn(d);
});
/* A press that hardly moves is a button: top = back, bottom = play/pause, left/right = previous/next track. */
const EDGE = { up: back, down: togglePlay, left: prev, right: next };
function edgePress(screenAngle) {
  let a = screenAngle - screenRot;             // angle in the deck's own frame
  a = ((a + 540) % 360) - 180;
  const dir = a > -135 && a <= -45 ? 'up' : a > -45 && a <= 45 ? 'right' : a > 45 && a <= 135 ? 'down' : 'left';
  knob.classList.add('t-' + dir);
  setTimeout(() => knob.classList.remove('t-' + dir), 140);
  tick(true);
  EDGE[dir]();
}
knob.addEventListener('pointerup', e => {
  if (e.pointerId !== dragId) return;
  dragId = null;
  const r = knob.getBoundingClientRect();
  const dist = Math.hypot(downX - (r.left + r.width / 2), downY - (r.top + r.height / 2));
  if (Math.hypot(e.clientX - downX, e.clientY - downY) < 12 && Math.abs(moved) < 12 && dist > r.width * 0.24) edgePress(downA);
});
knob.addEventListener('pointercancel', e => { if (e.pointerId === dragId) dragId = null; });
let wheelAcc = 0;
const wheelScroll = e => {
  e.preventDefault(); ensureAudioCtx();
  wheelAcc += e.deltaY;
  while (wheelAcc >= 40) { wheelAcc -= 40; turn(STEP); }
  while (wheelAcc <= -40) { wheelAcc += 40; turn(-STEP); }
};
knob.addEventListener('wheel', wheelScroll, { passive: false });
document.querySelector('.vfd').addEventListener('wheel', e => { if (!['edit', 'help', 'welcome', 'share'].includes(cur().kind)) wheelScroll(e); }, { passive: false });

function favTarget() {
  const v = cur();
  if (v.kind === 'now') return current;
  if (v.kind === 'list') { const it = (v.items || [])[v.sel]; return it && it.track ? it.track : null; }
  return null;
}
function favAction() {
  const t = favTarget();
  tick(true);
  if (!t) { return; }
  toggleFav(t);   // the ♥ next to the artist and the button state show the result; no message
  setTimeout(() => tick(true), 110);
  setAnn(); render();
}
// short press = select, hold ~0.5 s until the ring lights up = favourite
// iOS often swallows the click after a long press, so the favourite is toggled by the timer itself.
let armTimer = 0, heldFired = false;
cap.addEventListener('pointerdown', () => {
  heldFired = false; clearTimeout(armTimer);
  armTimer = setTimeout(() => {
    heldFired = true;
    cap.classList.add('armed');
    favAction();
    setTimeout(() => cap.classList.remove('armed'), 500);
  }, 550);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cap.addEventListener(ev, () => clearTimeout(armTimer)));
cap.addEventListener('contextmenu', e => e.preventDefault());
cap.addEventListener('click', () => {
  unlock();
  if (heldFired) { heldFired = false; return; }
  tick(true); select();
});
vbody.addEventListener('click', e => {
  const row = e.target.closest('.row');
  const v = cur();
  if (!row || v.kind !== 'list') return;
  unlock();
  v.sel = +row.dataset.i; tick(true); render();
  const it = v.items[v.sel];
  if (it && it.go) it.go();
});
document.addEventListener('pointerdown', unlock, { capture: true, passive: true });
vtitle.addEventListener('click', () => { if (stack.length > 1) { unlock(); tick(true); back(); } });
vtitle.addEventListener('keydown', e => {
  if (stack.length > 1 && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); e.stopPropagation(); unlock(); tick(true); back();
  }
});
// swipe right across the display = back
let swX = null, swY = 0;
const vfdEl = document.querySelector('.vfd');
vfdEl.addEventListener('pointerdown', e => { swX = e.clientX; swY = e.clientY; });
vfdEl.addEventListener('pointerup', e => {
  if (swX == null) return;
  let dx = e.clientX - swX, dy = e.clientY - swY;
  if (screenRot) { const r = -screenRot * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r); [dx, dy] = [dx * c - dy * sn, dx * sn + dy * c]; }
  swX = null;
  if (dx > 60 && Math.abs(dy) < 50 && stack.length > 1) { tick(true); back(); }
});
document.addEventListener('touchstart', () => {}, { passive: true });   // enables :active on iOS
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.defaultPrevented || tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
  const k = e.key;
  if (k === 'ArrowDown') { turn(STEP); e.preventDefault(); }
  else if (k === 'ArrowUp') { turn(-STEP); e.preventDefault(); }
  else if (k === 'Enter' && tag !== 'BUTTON') { tick(true); select(); e.preventDefault(); }
  else if (k === 'Escape' || k === 'Backspace') { tick(true); back(); e.preventDefault(); }
  else if (k === ' ' && tag !== 'BUTTON') { togglePlay(); e.preventDefault(); }
  else if (k === 'ArrowRight') next();
  else if (k === 'ArrowLeft') prev();
});
window.addEventListener('resize', () => { fitOrientation(); render(); });

/* ---------- boot ---------- */
function fitOrientation() {   // the deck follows the screen; --dw/--dh hold the real window size (iOS home-screen apps misreport 100vh)
  const root = document.documentElement;
  root.style.setProperty('--dw', window.innerWidth + 'px');
  root.style.setProperty('--dh', window.innerHeight + 'px');
}
fitOrientation();
window.addEventListener('orientationchange', () => setTimeout(() => { fitOrientation(); render(); }, 150));
stack = [mainView()];
setAnn();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (cur().kind === 'list') render(); });
if (!openSharedTrack() && !store.get('onboarded', false)) showWelcome();
window.addEventListener('hashchange', () => { scanEpoch++; stack = [mainView()]; render(); openSharedTrack(); });
listFolder('/').catch(() => {});   // warm the artist list
// installable app (Android "Установить приложение") and offline start; only on the real site
if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});

window.__deka = { parseName };
})();
</script>
