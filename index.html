<style>
/* Layout: one hardware faceplate. Glowing VFD window on top, four transport keys, then a 24-detent selector knob. */
:root{
  --row:34px; --rowf:17px;   /* list row height and text size; larger on a computer screen */
  --dw:100vw; --dh:100vh;   /* the deck's own width/height; swapped by script when the phone is turned */
  --room:#0b0c0e;
  --plate:#1b1e22; --plate-hi:#262a30; --plate-lo:#131518;
  --silk:#dfe3e8; --silk-dim:#aab1ba; --engrave:#7d858f; --engrave-dim:#4b5159;
  --glass:#04100e;
  --glow:#74f2d9; --dim:rgba(116,242,217,.42); --ghost:rgba(116,242,217,.11);
  --halo:0 0 1px rgba(116,242,217,.9),0 0 9px rgba(116,242,217,.45);
  --f-brand:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-vfd:"Jura","Trebuchet MS",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* the canvas takes the plate's bottom colour, so no strip of another grey can show under the deck */
html{background:var(--plate-lo)}
body{
  background:transparent;color:var(--engrave);font-family:var(--f-mono);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
.deck{
  /* pinned to all four edges: in a home-screen app 100vh/100dvh can come up short by the status bar */
  position:fixed;inset:0;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--plate-hi),var(--plate) 45%,var(--plate-lo));
}
@media (min-width:560px) and (min-height:600px){
  body{background:var(--room);display:grid;place-items:center}
  .deck{position:relative;inset:auto;width:440px;height:min(920px,calc(100dvh - 48px));border-radius:30px;
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
}


/* VFD window */
.vfd{
  position:relative;flex:1 1 auto;min-height:170px;display:flex;flex-direction:column;gap:6px;
  padding:10px 12px 9px;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#0a1c19,var(--glass) 70%);
  box-shadow:inset 0 0 0 1px #000,inset 0 6px 18px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.07);
  color:var(--glow);font-family:var(--f-vfd);
}
.vfd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.6) .6px,transparent 1px);background-size:3px 3px;opacity:.35}
.vfd::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 32%)}
.vfd-title.can-back{cursor:pointer;color:var(--glow)}
.vfd-title .bk{font-size:15px;line-height:0;margin-right:2px}
.vfd{touch-action:none}
.vfd-title{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--dim);
  border-bottom:1px solid var(--ghost);padding-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfd-body{position:relative;flex:1 1 auto;min-height:0}
.row{display:flex;align-items:center;gap:6px;height:var(--row);padding-right:12px;cursor:pointer;
  font-weight:600;font-size:var(--rowf);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.row.on{color:var(--glow);text-shadow:var(--halo)}
.car{flex:0 0 12px;width:12px}
.lbl{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}

      '</span><span class="lbl"><span class="txt">' + esc(it.label) + '</span></span><span class="hint">' +
      (playing ? (audio.paused ? '‖' : '♪') : (!it.hint && it.track ? (isFav(it.track) ? HEART : '') + (isSaved(it.track) ? '✓' : '') : esc(it.hint || ''))) + '</span></div>';
  }
  if (items.length > rows) {
    html += '<div class="sb"><i style="top:' + (v.top / items.length * 100) + '%;height:' + (rows / items.length * 100) + '%"></i></div>';
  }
  vbody.innerHTML = html;
  marquee();
  }
function marquee() {
  if (reduceMotion) return;
  const t = vbody.querySelector('.row.on .txt');
  if (!t) return;
  const over = t.scrollWidth - t.parentElement.clientWidth;
  if (over > 4) {
    t.style.setProperty('--shift', (-over - 16) + 'px');
    t.style.setProperty('--dur', Math.max(3, over / 28).toFixed(1) + 's');
    t.classList.add('mq');
  }
}
let segEls = null, npEl = null, npRem = null;
function renderNow() {
  vbody.className = 'vfd-body';
  if (!current) {
    vbody.innerHTML = '<div class="msg">НЕТ ТРЕКА<small>Выбери исполнителя в меню</small></div>';
    segEls = null; return;
  }
  const p = parseName(current.name, artistOf(current));
  vbody.innerHTML =
    '<div class="np"><div class="np-meta"><span>ТРЕК ' + (qi + 1) + ' / ' + queue.length + '</span><span>' + esc(current.folder || queueName) + '</span></div>' +
    '<div class="np-mid"><div class="np-artist">' + (isFav(current) ? HEART + ' ' : '') + esc(p.artist) + '</div><div class="np-title">' + esc(p.title) + '</div>' +
    (current.err ? '<div class="np-err">НЕ ИГРАЕТ — ' + esc(current.err) + (current.status ? '<br>' + esc(current.status) : '') + '</div>' : '') + '</div>' +
    '<div class="np-actions"><button type="button" class="vbtn" id="npAct"></button></div>' +
    '<div class="np-bar">' + '<i></i>'.repeat(SEGS) + '</div>' +
    '<div class="np-time"><span id="npEl">00:00</span><span id="npRem">-00:00</span></div></div>';
  segEls = vbody.querySelectorAll('.np-bar i'); npEl = $('npEl'); npRem = $('npRem');
  wireAct($('npAct'));
  updateDl();
  updateNow(); }
/* "Скачать" saves the track into the player's own storage; a second tap on "в памяти" offers removal. */
/* One button on the track screen.
   ♡ В ИЗБРАННОЕ → (now ♥) СКАЧАТЬ → progress → В ПАМЯТИ → tap again to offer removal from memory.
   Holding the button (or the centre of the wheel) takes the track out of favourites. */
let delArm = null, delTimer = 0;
function updateDl() {
  const b = $('npAct'), t = current;
  if (!b || !t) return;
  const fav = isFav(t), st = dlState(t);
  b.classList.toggle('on', fav || st === 'saved');
  const h = fav ? HEART + ' ' : '';
  if (st === 'saved') { b.textContent = h + (delArm === t ? 'УДАЛИТЬ ИЗ ПАМЯТИ?' : 'В ПАМЯТИ ✓'); return; }
  if (st === 'busy') { b.textContent = h + 'ЗАГРУЗКА ' + Math.round((t.dlProgress || 0) * 100) + '%'; return; }
  if (st === 'queued') { b.textContent = h + 'В ОЧЕРЕДИ'; return; }
  if (!fav) { b.textContent = '♡ В ИЗБРАННОЕ'; return; }
  b.textContent = h + (t.dlFail && Date.now() - t.dlFail < 4000 ? (dlErr === 'НЕТ МЕСТА' ? 'НЕТ МЕСТА' : 'ОШИБКА, ЕЩЁ РАЗ') : 'СКАЧАТЬ ↓');
}
/* Tap: ♡ → favourite → download → (in memory) ask → delete. A track already in memory always offers deletion,
   even if it was downloaded before it became a favourite. Hold: add to / remove from favourites. */
function actButton() {
  const t = current;
  if (!t) return;
  const st = dlState(t);
  if (st === 'saved') {
    clearTimeout(delTimer);
    if (delArm === t) { delArm = null; removeSaved(t).then(render); }
    else { delArm = t; delTimer = setTimeout(() => { delArm = null; updateDl(); }, 3000); updateDl(); }
    return;
  }
  if (st !== 'none') return;
  if (!isFav(t)) { toggleFav(t); render(); return; }
  queueDownload([t]);
}
function wireAct(b) {
  let holdTimer = 0, held = false;
  b.addEventListener('pointerdown', () => {
    held = false; clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      held = true;
      if (current) { delArm = null; toggleFav(current); tick(true); render(); }
    }, 550);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => clearTimeout(holdTimer)));
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('click', e => {
    e.stopPropagation(); unlock();
    if (held) { held = false; return; }
    tick(true); actButton();
  });
}
function updateNow() {
  if (cur().kind !== 'now' || !current || !segEls) return;
  if (current.blobP && !current.blobUrl) {          // whole-track download in progress
    const pr = current.progress || 0, litDl = Math.round(pr * SEGS);
    npEl.textContent = Math.round(pr * 100) + '%';
    npEl.classList.remove('scrub');
    npRem.textContent = 'ЗАГРУЗКА';
    segEls.forEach((s, i) => s.classList.toggle('on', i < litDl));
    return;
  }
  const d = audio.duration, t = scrubT != null ? scrubT : audio.currentTime;
  npEl.textContent = fmt(t);
  npEl.classList.toggle('scrub', scrubT != null);
  npRem.textContent = isFinite(d) ? '-' + fmt(Math.max(0, d - t)) : '--:--';
  const lit = isFinite(d) && d > 0 ? Math.round(t / d * SEGS) : 0;
  segEls.forEach((s, i) => s.classList.toggle('on', i < lit));
}
function renderEdit() {
  if ($('keyInput')) return;
  vbody.className = 'vfd-body';
  vbody.innerHTML =
    '<form class="edit" id="editForm"><label for="keyInput">Публичная ссылка на папку</label>' +
    '<input id="keyInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div class="edit-row"><button class="vbtn primary" type="submit">Сохранить</button><button class="vbtn" type="button" id="resetKey">Стандартная</button></div>' +
    '<small>На Диске: папка → Поделиться → Скопировать ссылку. Подойдёт любая публичная папка с музыкой.</small></form>';
  $('keyInput').value = settings.key;
  $('editForm').addEventListener('submit', e => { e.preventDefault(); tick(true); saveKey(); });
  $('resetKey').addEventListener('click', () => { tick(true); $('keyInput').value = DEFAULT_KEY; });
  }

/* ---------- controls ---------- */
let scrubT = null, scrubTimer = 0;
function scrub(dir) {
  const d = audio.duration;
  if (!isFinite(d)) return false;
  scrubT = Math.max(0, Math.min(d - 1, (scrubT != null ? scrubT : audio.currentTime) + dir * 5));
  updateNow();
  clearTimeout(scrubTimer);
  scrubTimer = setTimeout(() => { try { audio.currentTime = scrubT; } catch (e) {} scrubT = null; updateNow(); }, 450);
  return true;
}
function step(dir) {
  const v = cur();
  if (v.kind === 'list') {
    const items = v.items || [];
    if (!items.length) return;
    const n = Math.max(0, Math.min(items.length - 1, v.sel + dir));
    if (n === v.sel) return;       // hard stop at the ends: no click
    v.sel = n; tick(false); render();
  } else if (v.kind === 'now') {
    if (current && scrub(dir)) tick(false);
  }
}
function select() {
  const v = cur();
  if (v.kind === 'list') { const it = (v.items || [])[v.sel]; if (it && it.go) it.go(); }
  else if (v.kind === 'now') togglePlay();
  else if (v.kind === 'edit') saveKey();
}

let rot = 0, acc = 0, lastA = 0, dragId = null, downX = 0, downY = 0, downA = 0, moved = 0;
const screenRot = 0;
function angleOf(e) {
  const r = knob.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  return { a: Math.atan2(dy, dx) * 180 / Math.PI, dist: Math.hypot(dx, dy), size: r.width };
}
function turn(d) {
  rot += d; acc += d;
  face.style.transform = 'rotate(' + rot.toFixed(2) + 'deg)';
  while (acc >= STEP) { acc -= STEP; step(1); }
  while (acc <= -STEP) { acc += STEP; step(-1); }
}
knob.addEventListener('pointerdown', e => {
  if (e.target === cap) return;
  unlock();
  dragId = e.pointerId;
  try { knob.setPointerCapture(e.pointerId); } catch (err) {}
  const g = angleOf(e);
  lastA = downA = g.a; acc = 0; moved = 0; downX = e.clientX; downY = e.clientY;
  e.preventDefault();
});
knob.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const { a, dist, size } = angleOf(e);
  let d = a - lastA;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  lastA = a;
  if (dist < size * 0.12) return;   // too close to the centre: angle is noise
  moved += d;
  turn(d);
});
/* A press that hardly moves is a button: top = back, bottom = play/pause, left/right = previous/next track. */
const EDGE = { up: back, down: togglePlay, left: prev, right: next };
function edgePress(screenAngle) {
  let a = screenAngle - screenRot;             // angle in the deck's own frame
  a = ((a + 540) % 360) - 180;
  const dir = a > -135 && a <= -45 ? 'up' : a > -45 && a <= 45 ? 'right' : a > 45 && a <= 135 ? 'down' : 'left';
  knob.classList.add('t-' + dir);
  setTimeout(() => knob.classList.remove('t-' + dir), 140);
  tick(true);
  EDGE[dir]();
}
knob.addEventListener('pointerup', e => {
  if (e.pointerId !== dragId) return;
  dragId = null;
  const r = knob.getBoundingClientRect();
  const dist = Math.hypot(downX - (r.left + r.width / 2), downY - (r.top + r.height / 2));
  if (Math.hypot(e.clientX - downX, e.clientY - downY) < 12 && Math.abs(moved) < 12 && dist > r.width * 0.24) edgePress(downA);
});
knob.addEventListener('pointercancel', e => { if (e.pointerId === dragId) dragId = null; });
let wheelAcc = 0;
const wheelScroll = e => {
  e.preventDefault(); ensureAudioCtx();
  wheelAcc += e.deltaY;
  while (wheelAcc >= 40) { wheelAcc -= 40; turn(STEP); }
  while (wheelAcc <= -40) { wheelAcc += 40; turn(-STEP); }
};
knob.addEventListener('wheel', wheelScroll, { passive: false });
document.querySelector('.vfd').addEventListener('wheel', e => { if (cur().kind !== 'edit') wheelScroll(e); }, { passive: false });

function favTarget() {
  const v = cur();
  if (v.kind === 'now') return current;
  if (v.kind === 'list') { const it = (v.items || [])[v.sel]; return it && it.track ? it.track : null; }
  return null;
}
function favAction() {
  const t = favTarget();
  tick(true);
  if (!t) { return; }
  toggleFav(t);   // the ♥ next to the artist and the button state show the result; no message
  setTimeout(() => tick(true), 110);
  setAnn(); render();
}
// short press = select, hold ~0.5 s until the ring lights up = favourite
// iOS often swallows the click after a long press, so the favourite is toggled by the timer itself.
let armTimer = 0, heldFired = false;
cap.addEventListener('pointerdown', () => {
  heldFired = false; clearTimeout(armTimer);
  armTimer = setTimeout(() => {
    heldFired = true;
    cap.classList.add('armed');
    favAction();
    setTimeout(() => cap.classList.remove('armed'), 500);
  }, 550);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cap.addEventListener(ev, () => clearTimeout(armTimer)));
cap.addEventListener('contextmenu', e => e.preventDefault());
cap.addEventListener('click', () => {
  unlock();
  if (heldFired) { heldFired = false; return; }
  tick(true); select();
});
vbody.addEventListener('click', e => {
  const row = e.target.closest('.row');
  const v = cur();
  if (!row || v.kind !== 'list') return;
  unlock();
  v.sel = +row.dataset.i; tick(true); render();
  const it = v.items[v.sel];
  if (it && it.go) it.go();
});
document.addEventListener('pointerdown', unlock, { capture: true, passive: true });
vtitle.addEventListener('click', () => { if (stack.length > 1) { unlock(); tick(true); back(); } });
// swipe right across the display = back
let swX = null, swY = 0;
const vfdEl = document.querySelector('.vfd');
vfdEl.addEventListener('pointerdown', e => { swX = e.clientX; swY = e.clientY; });
vfdEl.addEventListener('pointerup', e => {
  if (swX == null) return;
  let dx = e.clientX - swX, dy = e.clientY - swY;
  if (screenRot) { const r = -screenRot * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r); [dx, dy] = [dx * c - dy * sn, dx * sn + dy * c]; }
  swX = null;
  if (dx > 60 && Math.abs(dy) < 50 && stack.length > 1) { tick(true); back(); }

document.addEventListener('touchstart', () => {}, { passive: true });   // enables :active on iOS
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT') return;
  const k = e.key;
  if (k === 'ArrowDown') { turn(STEP); e.preventDefault(); }
  else if (k === 'ArrowUp') { turn(-STEP); e.preventDefault(); }
  else if (k === 'Enter' && tag !== 'BUTTON') { tick(true); select(); e.preventDefault(); }
  else if (k === 'Escape' || k === 'Backspace') { tick(true); back(); e.preventDefault(); }
  else if (k === ' ' && tag !== 'BUTTON') { togglePlay(); e.preventDefault(); }
  else if (k === 'ArrowRight') next();
  else if (k === 'ArrowLeft') prev();
});
window.addEventListener('resize', () => { fitOrientation(); render(); });

/* ---------- boot ---------- */
function fitOrientation() {   // the deck follows the screen; --dw/--dh hold the real window size (iOS home-screen apps misreport 100vh)
  const root = document.documentElement;
  root.style.setProperty('--dw', window.innerWidth + 'px');
  root.style.setProperty('--dh', window.innerHeight + 'px');
}
fitOrientation();
window.addEventListener('orientationchange', () => setTimeout(() => { fitOrientation(); render(); }, 150));
stack = [mainView()];
setAnn();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (cur().kind === 'list') render(); });
listFolder('/').catch(() => {});   // warm the artist list
// installable app (Android "Установить приложение") and offline start; only on the real site

})();
